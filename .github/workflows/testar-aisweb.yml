name: Testar AISWEB

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Inspecionar AISWEB SBUR
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from html import unescape

          ICAO = "SBUR"

          print("========================================")
          print("LEOSPOTTER")
          print("INSPEÇÃO AISWEB")
          print("========================================")
          print()

          url = (
              "https://aisweb.decea.mil.br/"
              "?codigo="
              + ICAO
              + "&i=aerodromos"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent":
                  "Mozilla/5.0 "
                  "(Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/120 Safari/537.36"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=60
          ) as response:
              html = response.read()
              status = response.status

          print("HTTP:", status)
          print("Bytes:", len(html))
          print()

          # ==========================================
          # HTML -> TEXTO
          # ==========================================

          texto = html.decode(
              "utf-8",
              errors="replace"
          )

          texto = unescape(texto)

          texto = re.sub(
              r"<script.*?</script>",
              " ",
              texto,
              flags=re.I | re.S
          )

          texto = re.sub(
              r"<style.*?</style>",
              " ",
              texto,
              flags=re.I | re.S
          )

          texto = re.sub(
              r"<br\s*/?>",
              "\n",
              texto,
              flags=re.I
          )

          texto = re.sub(
              r"</p>|</div>|</tr>|</li>|</h[1-6]>",
              "\n",
              texto,
              flags=re.I
          )

          texto = re.sub(
              r"<[^>]+>",
              " ",
              texto
          )

          texto = re.sub(
              r"[ \t]+",
              " ",
              texto
          )

          texto = re.sub(
              r"\n\s*\n+",
              "\n",
              texto
          )

          texto = texto.strip()

          linhas = [
              linha.strip()
              for linha in texto.splitlines()
              if linha.strip()
          ]

          # ==========================================
          # MOSTRAR INFORMAÇÕES DO SBUR
          # ==========================================

          print("========================================")
          print("INFORMAÇÕES DO AERÓDROMO")
          print("========================================")

          for i, linha in enumerate(linhas):

              if ICAO in linha.upper():

                  inicio = max(0, i - 5)
                  fim = min(len(linhas), i + 15)

                  for n in range(inicio, fim):
                      print(
                          f"{n:04d}: {linhas[n]}"
                      )

                  break

          # ==========================================
          # LOCALIZAR TORA / TODA / ASDA / LDA
          # ==========================================

          print()
          print("========================================")
          print("LOCALIZAÇÃO DAS DISTÂNCIAS DE PISTA")
          print("========================================")

          palavras = (
              "TORA",
              "TODA",
              "ASDA",
              "LDA"
          )

          encontrados = set()

          for i, linha in enumerate(linhas):

              upper = linha.upper()

              if any(
                  palavra in upper
                  for palavra in palavras
              ):

                  inicio = max(0, i - 10)
                  fim = min(len(linhas), i + 20)

                  bloco = "\n".join(
                      linhas[inicio:fim]
                  )

                  if bloco in encontrados:
                      continue

                  encontrados.add(bloco)

                  print()
                  print(
                      f"--- região encontrada na linha {i} ---"
                  )

                  for n in range(inicio, fim):
                      print(
                          f"{n:04d}: {linhas[n]}"
                      )

          # ==========================================
          # LOCALIZAR RWY
          # ==========================================

          print()
          print("========================================")
          print("LOCALIZAÇÃO DAS CABECEIRAS")
          print("========================================")

          for i, linha in enumerate(linhas):

              upper = linha.upper()

              if (
                  "RWY" in upper
                  or "PISTA" in upper
                  or re.search(
                      r"\b\d{2}\s*-\s*\d{2}\b",
                      upper
                  )
              ):

                  inicio = max(0, i - 5)
                  fim = min(len(linhas), i + 20)

                  print()

                  for n in range(inicio, fim):
                      print(
                          f"{n:04d}: {linhas[n]}"
                      )

          # ==========================================
          # LOCALIZAR FREQUÊNCIAS
          # ==========================================

          print()
          print("========================================")
          print("LOCALIZAÇÃO DAS FREQUÊNCIAS")
          print("========================================")

          padrao_frequencia = re.compile(
              r"\b\d{3}\.\d{3}\b"
          )

          indices = []

          for i, linha in enumerate(linhas):

              if padrao_frequencia.search(
                  linha
              ):

                  indices.append(i)

          if not indices:

              print(
                  "Nenhuma frequência encontrada."
              )

          else:

              vistos = set()

              for i in indices:

                  inicio = max(0, i - 8)
                  fim = min(len(linhas), i + 8)

                  bloco = "\n".join(
                      linhas[inicio:fim]
                  )

                  if bloco in vistos:
                      continue

                  vistos.add(bloco)

                  print()
                  print(
                      f"--- frequência próxima à linha {i} ---"
                  )

                  for n in range(inicio, fim):
                      print(
                          f"{n:04d}: {linhas[n]}"
                      )

          # ==========================================
          # TODAS AS FREQUÊNCIAS
          # ==========================================

          print()
          print("========================================")
          print("FREQUÊNCIAS ENCONTRADAS")
          print("========================================")

          frequencias = re.findall(
              r"\b\d{3}\.\d{3}\b",
              texto
          )

          unicas = []

          for frequencia in frequencias:

              if frequencia not in unicas:
                  unicas.append(frequencia)

          if unicas:

              for frequencia in unicas:
                  print(
                      "Frequência:",
                      frequencia
                  )

          else:

              print(
                  "Nenhuma frequência encontrada."
              )

          # ==========================================
          # DATA AISWEB
          # ==========================================

          print()
          print("========================================")
          print("DATA DA INFORMAÇÃO")
          print("========================================")

          datas = re.findall(
              r"ÚLTIMA ATUALIZAÇÃO\s*:?\s*"
              r"(\d{2}/\d{2}/\d{4})",
              texto.upper()
          )

          if datas:

              for data in datas:
                  print(
                      "Última atualização:",
                      data
                  )

          else:

              print(
                  "Data não encontrada."
              )

          # ==========================================
          # COORDENADAS
          # ==========================================

          print()
          print("========================================")
          print("COORDENADAS")
          print("========================================")

          coordenadas = re.findall(
              r"[NS]\s*\d{1,3}\s+\d{1,2}\s+[\d.]+\s+"
              r"[EW]\s*\d{1,3}\s+\d{1,2}\s+[\d.]+",
              texto.upper()
          )

          if coordenadas:

              for coordenada in coordenadas:
                  print(
                      coordenada
                  )

          else:

              print(
                  "Coordenadas não encontradas."
              )

          print()
          print("========================================")
          print("FIM DA INSPEÇÃO")
          print("========================================")

          PY
