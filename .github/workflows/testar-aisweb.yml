name: Inspecionar AISWEB SBUR

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:

      - name: Inspecionar AISWEB
        run: |

          python - <<'PY'

          import urllib.request
          from html import unescape
          import re

          ICAO = "SBUR"

          print("========================================")
          print("LEOSPOTTER")
          print("INSPEÇÃO AISWEB")
          print("========================================")
          print()

          url = (
              "https://aisweb.decea.mil.br/"
              "?codigo="
              + ICAO
              + "&i=aerodromos"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent":
                  "Mozilla/5.0 "
                  "(Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/120 Safari/537.36"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=60
          ) as response:

              html = response.read()

              print("HTTP:", response.status)
              print("Bytes:", len(html))

          # ======================================
          # SALVAR HTML ORIGINAL
          # ======================================

          with open(
              "aisweb_sbur.html",
              "wb"
          ) as arquivo:

              arquivo.write(html)

          print()
          print("HTML original salvo.")

          # ======================================
          # CONVERTER PARA TEXTO
          # ======================================

          texto = html.decode(
              "utf-8",
              errors="replace"
          )

          texto = unescape(texto)

          # Remover scripts
          texto = re.sub(
              r"<script.*?</script>",
              " ",
              texto,
              flags=re.I | re.S
          )

          # Remover CSS
          texto = re.sub(
              r"<style.*?</style>",
              " ",
              texto,
              flags=re.I | re.S
          )

          # Quebras
          texto = re.sub(
              r"<br\s*/?>",
              "\n",
              texto,
              flags=re.I
          )

          texto = re.sub(
              r"</p>|</div>|</tr>|</li>|</h[1-6]>",
              "\n",
              texto,
              flags=re.I
          )

          # Remover HTML
          texto = re.sub(
              r"<[^>]+>",
              " ",
              texto
          )

          # Espaços
          texto = re.sub(
              r"[ \t]+",
              " ",
              texto
          )

          texto = re.sub(
              r"\n\s*\n+",
              "\n",
              texto
          )

          texto = texto.strip()

          with open(
              "aisweb_sbur.txt",
              "w",
              encoding="utf-8"
          ) as arquivo:

              arquivo.write(texto)

          print(
              "Texto convertido salvo."
          )

          # ======================================
          # MOSTRAR TRECHOS IMPORTANTES
          # ======================================

          upper = texto.upper()

          termos = [
              "PISTA",
              "RWY",
              "FREQUÊNCIA",
              "FREQUENCIA",
              "COM",
              "TWR",
              "ATIS",
              "AFIS",
              "RÁDIO",
              "RADIO",
              "18/36",
              "18 -",
              "36 -",
              "ÚLTIMA ATUALIZAÇÃO"
          ]

          print()
          print("========================================")
          print("TRECHOS ENCONTRADOS")
          print("========================================")

          linhas = upper.splitlines()

          encontrados = set()

          for numero, linha in enumerate(linhas):

              for termo in termos:

                  if termo in linha:

                      inicio = max(
                          0,
                          numero - 2
                      )

                      fim = min(
                          len(linhas),
                          numero + 3
                      )

                      chave = (
                          inicio,
                          fim
                      )

                      if chave in encontrados:
                          continue

                      encontrados.add(chave)

                      print()
                      print(
                          f"--- linhas "
                          f"{inicio + 1} até {fim} ---"
                      )

                      for i in range(
                          inicio,
                          fim
                      ):

                          print(
                              f"{i + 1:04d}: "
                              f"{linhas[i]}"
                          )

                      break

          print()
          print("========================================")
          print("FIM DA INSPEÇÃO")
          print("========================================")

          PY

      - name: Salvar arquivos para análise
        uses: actions/upload-artifact@v4
        with:
          name: aisweb-sbur
          path: |
            aisweb_sbur.html
            aisweb_sbur.txt
