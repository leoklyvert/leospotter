name: Testar parser AISWEB

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Testar AISWEB
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from html import unescape

          ICAO = "SBUR"

          print("========================================")
          print("LEOSPOTTER")
          print("TESTE AISWEB")
          print("========================================")
          print()
          print("ICAO:", ICAO)

          # ======================================
          # CONSULTA
          # ======================================

          url = (
              "https://aisweb.decea.mil.br/"
              "?codigo="
              + ICAO
              + "&i=aerodromos"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent":
                  "Mozilla/5.0 "
                  "(Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/120 Safari/537.36"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=60
          ) as response:
              html = response.read()

          print("HTTP:", response.status)
          print("Bytes:", len(html))

          # ======================================
          # LIMPEZA
          # ======================================

          texto = html.decode(
              "utf-8",
              errors="replace"
          )

          texto = unescape(texto)

          texto = re.sub(
              r"<script.*?</script>",
              " ",
              texto,
              flags=re.I | re.S
          )

          texto = re.sub(
              r"<style.*?</style>",
              " ",
              texto,
              flags=re.I | re.S
          )

          texto = re.sub(
              r"<br\s*/?>",
              "\n",
              texto,
              flags=re.I
          )

          texto = re.sub(
              r"</p>|</div>|</tr>|</li>",
              "\n",
              texto,
              flags=re.I
          )

          texto = re.sub(
              r"<[^>]+>",
              " ",
              texto
          )

          texto = re.sub(
              r"[ \t]+",
              " ",
              texto
          )

          texto = re.sub(
              r"\n\s*\n+",
              "\n",
              texto
          )

          texto = texto.strip()

          upper = texto.upper()

          # ======================================
          # RESULTADO
          # ======================================

          resultado = {
              "icao": ICAO,
              "nome": None,
              "municipio": None,
              "uf": None,
              "pistas": [],
              "frequencias": [],
              "distancias": [],
              "atualizacao": None
          }

          # ======================================
          # NOME / MUNICÍPIO / UF
          # ======================================

          padrao = re.search(
              r"([A-ZÀ-Ú0-9 .'\-]+)"
              r"\s*\(\s*"
              + ICAO
              + r"\s*\)"
              r"\s*/\s*"
              r"([^,\n]+)"
              r",\s*"
              r"([A-Z]{2})",
              upper
          )

          if padrao:
              resultado["nome"] = (
                  padrao.group(1)
                  .strip()
                  .title()
              )

              resultado["municipio"] = (
                  padrao.group(2)
                  .strip()
                  .title()
              )

              resultado["uf"] = (
                  padrao.group(3)
                  .strip()
              )

          # ======================================
          # PISTAS
          # ======================================

          pistas = re.findall(
              r"(\d{2})\s*-\s*.*?"
              r"\(\s*"
              r"(\d+)\s*[xX]\s*(\d+)"
              r"\s+([A-Z0-9]+)"
              r"\s+([0-9]+/[A-Z0-9/]+)"
              r".*?"
              r"\)\s*-\s*.*?"
              r"-\s*(\d{2})",
              upper,
              re.S
          )

          for pista in pistas:
              resultado["pistas"].append({
                  "identificacao":
                      pista[0] + "/" + pista[5],
                  "piso":
                      pista[3],
                  "dimensoes":
                      pista[1] + " x " + pista[2] + " m",
                  "resistencia":
                      pista[4]
              })

          # ======================================
          # FREQUÊNCIAS
          # ======================================

          frequencias = re.findall(
              r"(?:COM\s*-\s*)?"
              r"([A-ZÀ-Ú0-9 /-]{2,40})"
              r"\s+\[\d+\]"
              r"(?:\s+\[\d+\])*"
              r"\s+"
              r"(\d{3}\.\d{3})",
              upper
          )

          for servico, frequencia in frequencias:

              item = {
                  "orgao": servico.strip(),
                  "valor": frequencia,
                  "observacao": ""
              }

              if item not in resultado["frequencias"]:
                  resultado["frequencias"].append(item)

          # ======================================
          # DISTÂNCIAS
          # ======================================

          distancias = re.findall(
              r"\b(\d{2})\s+"
              r"(\d{3,5})\s+"
              r"(\d{3,5})\s+"
              r"(\d{3,5})\s+"
              r"(\d{3,5})\b",
              texto
          )

          for rwy, tora, toda, asda, lda in distancias:

              item = {
                  "rwy": rwy,
                  "tora": int(tora),
                  "toda": int(toda),
                  "asda": int(asda),
                  "lda": int(lda)
              }

              if item not in resultado["distancias"]:
                  resultado["distancias"].append(item)

          # ======================================
          # ATUALIZAÇÃO
          # ======================================

          data = re.search(
              r"ÚLTIMA ATUALIZAÇÃO\s*:\s*"
              r"(\d{2}/\d{2}/\d{4})",
              upper
          )

          if data:
              resultado["atualizacao"] = data.group(1)

          # ======================================
          # RESULTADO
          # ======================================

          print()
          print("========================================")
          print("RESULTADO")
          print("========================================")

          print(
              json.dumps(
                  resultado,
                  ensure_ascii=False,
                  indent=2
              )
          )

          # ======================================
          # VALIDAÇÃO
          # ======================================

          print()
          print("========================================")
          print("VALIDAÇÃO")
          print("========================================")

          erros = []

          if resultado["icao"] != ICAO:
              erros.append("ICAO não identificado")

          if not resultado["pistas"]:
              erros.append("Nenhuma pista encontrada")

          if not resultado["frequencias"]:
              erros.append("Nenhuma frequência encontrada")

          if erros:

              for erro in erros:
                  print("✗", erro)

              raise Exception(
                  "Parser AISWEB não passou na validação."
              )

          print("✓ ICAO:", resultado["icao"])
          print(
              "✓ Pistas:",
              len(resultado["pistas"])
          )
          print(
              "✓ Frequências:",
              len(resultado["frequencias"])
          )
          print(
              "✓ Distâncias:",
              len(resultado["distancias"])
          )
          print(
              "✓ Atualização:",
              resultado["atualizacao"]
          )

          print()
          print("========================================")
          print("✓ PARSER AISWEB FUNCIONANDO")
          print("========================================")

          PY
