name: Testar AISWEB

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:

      - name: Consultar AISWEB
        run: |
          python - <<'PY'
          import urllib.request

          icao = "SBUR"

          url = (
              "https://aisweb.decea.mil.br/"
              "?codigo="
              + icao
              + "&i=aerodromos"
          )

          print("========================================")
          print("TESTE AISWEB")
          print("========================================")
          print()
          print("ICAO:", icao)
          print()
          print("URL:")
          print(url)
          print()

          requisicao = urllib.request.Request(
              url,
              headers={
                  "User-Agent":
                  "Mozilla/5.0 "
                  "(Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "Chrome/120 Safari/537.36"
              }
          )

          with urllib.request.urlopen(
              requisicao,
              timeout=60
          ) as resposta:

              conteudo = resposta.read()

          print(
              "HTTP:",
              resposta.status
          )

          print(
              "Tamanho:",
              len(conteudo),
              "bytes"
          )

          texto = conteudo.decode(
              "utf-8",
              errors="replace"
          )

          print()
          print("========================================")
          print("PROCURANDO INFORMAÇÕES")
          print("========================================")
          print()

          termos = [
              "MARIO DE ALMEIDA FRANCO",
              "SBUR",
              "120.800",
              "1759x45",
              "ASPH"
          ]

          texto_maiusculo = texto.upper()

          for termo in termos:

              if termo.upper() in texto_maiusculo:

                  print(
                      "✓ Encontrado:",
                      termo
                  )

              else:

                  print(
                      "✗ Não encontrado:",
                      termo
                  )

          print()
          print("========================================")
          print("TESTE CONCLUÍDO")
          print("========================================")

          PY
