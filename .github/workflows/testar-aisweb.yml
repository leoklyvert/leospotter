name: Testar AISWEB

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Inspecionar estrutura da pista SBUR
        run: |
          python - <<'PY'
          import re
          import urllib.request
          from html import unescape

          ICAO = "SBUR"

          print("========================================")
          print("LEOSPOTTER")
          print("ESTRUTURA DA PISTA - AISWEB")
          print("========================================")

          url = (
              "https://aisweb.decea.mil.br/"
              "?codigo="
              + ICAO
              + "&i=aerodromos"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent":
                  "Mozilla/5.0 "
                  "(Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/120 Safari/537.36"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=60
          ) as response:

              html = response.read()

              print()
              print("HTTP:", response.status)
              print("Bytes:", len(html))

          texto = html.decode(
              "utf-8",
              errors="replace"
          )

          texto = unescape(texto)

          texto = re.sub(
              r"<script.*?</script>",
              " ",
              texto,
              flags=re.I | re.S
          )

          texto = re.sub(
              r"<style.*?</style>",
              " ",
              texto,
              flags=re.I | re.S
          )

          texto = re.sub(
              r"<br\s*/?>",
              "\n",
              texto,
              flags=re.I
          )

          texto = re.sub(
              r"</p>|</div>|</tr>|</li>|</h[1-6]>",
              "\n",
              texto,
              flags=re.I
          )

          texto = re.sub(
              r"<[^>]+>",
              " ",
              texto
          )

          texto = re.sub(
              r"[ \t]+",
              " ",
              texto
          )

          texto = re.sub(
              r"\n\s*\n+",
              "\n",
              texto
          )

          texto = texto.strip()

          linhas = [
              linha.strip()
              for linha in texto.splitlines()
              if linha.strip()
          ]

          print()
          print("========================================")
          print("LINHAS DA REGIÃO DA PISTA")
          print("========================================")

          for inicio, fim in [
              (135, 170),
              (145, 165),
              (150, 160)
          ]:

              print()
              print(
                  f"--- linhas {inicio} até {fim} ---"
              )

              for numero in range(
                  inicio,
                  min(fim + 1, len(linhas))
              ):

                  print(
                      f"{numero:04d}: {linhas[numero]}"
                  )

          print()
          print("========================================")
          print("BUSCA POR TORA / TODA / ASDA / LDA")
          print("========================================")

          palavras = (
              "TORA",
              "TODA",
              "ASDA",
              "LDA"
          )

          for numero, linha in enumerate(linhas):

              if any(
                  palavra in linha.upper()
                  for palavra in palavras
              ):

                  print(
                      f"{numero:04d}: {linha}"
                  )

          print()
          print("========================================")
          print("BUSCA POR PADRÕES DE CABECEIRA")
          print("========================================")

          for numero, linha in enumerate(linhas):

              encontrados = re.findall(
                  r"\b\d{2}\s*[-/]\s*\d{2}\b",
                  linha
              )

              if encontrados:

                  print(
                      f"{numero:04d}: {linha}"
                  )

          print()
          print("========================================")
          print("FIM DO TESTE")
          print("========================================")

          PY
