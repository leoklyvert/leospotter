name: Atualizar aeroportos

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:

  atualizar:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # BAIXAR REPOSITÓRIO
      # ==========================================

      - name: Baixar repositório
        uses: actions/checkout@v4


      # ==========================================
      # ATUALIZAR BASE
      # ==========================================

      - name: Atualizar base de aeroportos
        run: |

          python - <<'PY'

          import json
          import re
          import time
          import urllib.request

          from html import unescape
          from pathlib import Path


          # ==========================================
          # CONFIGURAÇÃO
          # ==========================================

          ARQUIVO = Path("data/aeroportos.json")

          ARQUIVO_TEMP = Path(
              "data/aeroportos.tmp.json"
          )

          MINIMO_AERODROMOS = 7000

          INTERVALO = 0.3


          print()
          print("========================================")
          print("LEOSPOTTER")
          print("ATUALIZAÇÃO DA BASE DE AEROPORTOS")
          print("========================================")
          print()


          # ==========================================
          # VERIFICAR EXISTÊNCIA
          # ==========================================

          if not ARQUIVO.exists():

              raise Exception(
                  "ERRO CRÍTICO: "
                  "data/aeroportos.json não existe."
              )


          # ==========================================
          # VERIFICAR TAMANHO
          # ==========================================

          tamanho = ARQUIVO.stat().st_size

          print(
              "Tamanho atual:",
              tamanho,
              "bytes"
          )


          if tamanho < 1000:

              raise Exception(
                  "ERRO CRÍTICO: "
                  "aeroportos.json parece vazio "
                  "ou corrompido."
              )


          # ==========================================
          # LER JSON
          # ==========================================

          print()
          print("Lendo base existente...")


          try:

              with open(
                  ARQUIVO,
                  "r",
                  encoding="utf-8"
              ) as arquivo:

                  aeroportos = json.load(
                      arquivo
                  )

          except Exception as erro:

              raise Exception(
                  "ERRO CRÍTICO: "
                  "aeroportos.json não contém "
                  "JSON válido.\n"
                  + str(erro)
              )


          # ==========================================
          # VALIDAR ESTRUTURA
          # ==========================================

          if not isinstance(
              aeroportos,
              list
          ):

              raise Exception(
                  "ERRO CRÍTICO: "
                  "aeroportos.json não contém "
                  "uma lista."
              )


          quantidade = len(
              aeroportos
          )


          print(
              "Aeródromos encontrados:",
              quantidade
          )


          # ==========================================
          # PROTEÇÃO CONTRA BASE INCOMPLETA
          # ==========================================

          if quantidade < MINIMO_AERODROMOS:

              raise Exception(
                  "ERRO CRÍTICO: "
                  f"a base possui apenas "
                  f"{quantidade} registros. "
                  f"Mínimo esperado: "
                  f"{MINIMO_AERODROMOS}."
              )


          # ==========================================
          # VALIDAR ICAOs
          # ==========================================

          icaos_validos = 0
          icaos_invalidos = 0


          for aeroporto in aeroportos:

              if not isinstance(
                  aeroporto,
                  dict
              ):

                  icaos_invalidos += 1

                  continue


              icao = aeroporto.get(
                  "icao"
              )


              if (
                  isinstance(
                      icao,
                      str
                  )
                  and
                  re.fullmatch(
                      r"[A-Z0-9]{4}",
                      icao.strip().upper()
                  )
              ):

                  icaos_validos += 1

              else:

                  icaos_invalidos += 1


          print(
              "ICAOs válidos:",
              icaos_validos
          )

          print(
              "ICAOs inválidos:",
              icaos_invalidos
          )


          if icaos_validos < MINIMO_AERODROMOS:

              raise Exception(
                  "ERRO CRÍTICO: "
                  "quantidade de ICAOs válidos "
                  "abaixo do esperado."
              )


          print()
          print(
              "✓ BASE ORIGINAL VALIDADA"
          )


          # ==========================================
          # CONSULTAR AISWEB
          # ==========================================

          def consultar_aisweb(icao):


              url = (
                  "https://aisweb.decea.mil.br/"
                  "?codigo="
                  + icao
                  + "&i=aerodromos"
              )


              requisicao = urllib.request.Request(

                  url,

                  headers={

                      "User-Agent":

                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/120 Safari/537.36"

                  }

              )


              with urllib.request.urlopen(

                  requisicao,

                  timeout=60

              ) as resposta:

                  conteudo = resposta.read()


                  status = resposta.status


              if status != 200:

                  raise Exception(
                      f"HTTP {status}"
                  )


              texto = conteudo.decode(

                  "utf-8",

                  errors="replace"

              )


              texto = unescape(
                  texto
              )


              # ======================================
              # LIMPAR HTML
              # ======================================

              texto = re.sub(

                  r"<script.*?</script>",

                  " ",

                  texto,

                  flags=re.I | re.S

              )


              texto = re.sub(

                  r"<style.*?</style>",

                  " ",

                  texto,

                  flags=re.I | re.S

              )


              texto = re.sub(

                  r"<br\s*/?>",

                  "\n",

                  texto,

                  flags=re.I

              )


              texto = re.sub(

                  r"</p>|</div>|</tr>|</li>|</h[1-6]>",

                  "\n",

                  texto,

                  flags=re.I

              )


              texto = re.sub(

                  r"<[^>]+>",

                  " ",

                  texto

              )


              texto = re.sub(

                  r"[ \t]+",

                  " ",

                  texto

              )


              texto = re.sub(

                  r"\n\s*\n+",

                  "\n",

                  texto

              )


              texto = texto.strip()


              texto_upper = texto.upper()


              resultado = {

                  "pistas": [],

                  "frequencias": [],

                  "distancias_declaradas": []

              }


              # ======================================
              # PISTAS
              # ======================================

              padrao_pista = re.search(

                  r"(\d{2})\s*-\s*.*?"

                  r"\(\s*"

                  r"(\d+)\s*[xX]\s*(\d+)"

                  r"\s+([A-Z0-9]+)"

                  r"\s+([0-9]+/[A-Z0-9/]+)"

                  r".*?"

                  r"\)\s*-\s*.*?"

                  r"-\s*(\d{2})",

                  texto_upper,

                  re.S

              )


              if padrao_pista:

                  resultado["pistas"].append({

                      "identificacao":

                      padrao_pista.group(1)
                      + "/"
                      + padrao_pista.group(6),


                      "piso":

                      padrao_pista.group(4),


                      "dimensoes":

                      padrao_pista.group(2)
                      + " x "
                      + padrao_pista.group(3)
                      + " m",


                      "resistencia":

                      padrao_pista.group(5)

                  })


              # ======================================
              # FREQUÊNCIAS
              # ======================================

              frequencias = re.findall(

                  r"(?:COM\s*-\s*)?"

                  r"([A-ZÀ-Ú0-9 /-]{2,40})"

                  r"\s+\[\d+\]"

                  r"(?:\s+\[\d+\])*"

                  r"\s+"

                  r"(\d{3}\.\d{3})",

                  texto_upper

              )


              for (

                  servico,

                  frequencia

              ) in frequencias:


                  servico = servico.strip()


                  existe = any(

                      f["orgao"] == servico

                      and

                      f["valor"] == frequencia

                      for f in resultado[
                          "frequencias"
                      ]

                  )


                  if not existe:

                      resultado[
                          "frequencias"
                      ].append({

                          "orgao":
                          servico,

                          "valor":
                          frequencia,

                          "observacao":
                          ""

                      })


              # ======================================
              # DISTÂNCIAS DECLARADAS
              # ======================================

              padrao_distancias = re.findall(

                  r"\n\s*(\d{2})\s+"
                  r"(\d+)\s+"
                  r"(\d+)\s+"
                  r"(\d+)\s+"
                  r"(\d+)",

                  texto

              )


              for (

                  cabeceira,
                  tora,
                  toda,
                  asda,
                  lda

              ) in padrao_distancias:


                  resultado[
                      "distancias_declaradas"
                  ].append({

                      "rwy":
                      cabeceira,

                      "tora":
                      int(tora),

                      "toda":
                      int(toda),

                      "asda":
                      int(asda),

                      "lda":
                      int(lda)

                  })


              # ======================================
              # VALIDAÇÃO
              # ======================================

              if not resultado[
                  "pistas"
              ]:

                  raise Exception(
                      "Nenhuma pista encontrada"
                  )


              if not resultado[
                  "frequencias"
              ]:

                  raise Exception(
                      "Nenhuma frequência encontrada"
                  )


              return resultado


          # ==========================================
          # PROCESSAMENTO
          # ==========================================

          atualizados = 0
          erros = 0
          sem_icao = 0

          total_pistas = 0
          total_frequencias = 0
          total_distancias = 0


          for numero, aeroporto in enumerate(

              aeroportos,

              start=1

          ):


              icao = aeroporto.get(
                  "icao"
              )


              if not icao:

                  sem_icao += 1

                  continue


              icao = str(
                  icao
              ).strip().upper()


              print()

              print(
                  f"[{numero}/{quantidade}] "
                  f"Consultando {icao}..."
              )


              try:


                  dados = consultar_aisweb(
                      icao
                  )


                  aeroporto[
                      "pistas"
                  ] = dados[
                      "pistas"
                  ]


                  aeroporto[
                      "frequencias"
                  ] = dados[
                      "frequencias"
                  ]


                  aeroporto[
                      "distancias_declaradas"
                  ] = dados[
                      "distancias_declaradas"
                  ]


                  atualizados += 1


                  total_pistas += len(
                      dados["pistas"]
                  )


                  total_frequencias += len(
                      dados["frequencias"]
                  )


                  total_distancias += len(
                      dados[
                          "distancias_declaradas"
                      ]
                  )


                  print(
                      f"  ✓ {icao} atualizado"
                  )


                  print(
                      f"    Pistas: "
                      f"{len(dados['pistas'])}"
                  )


                  print(
                      f"    Frequências: "
                      f"{len(dados['frequencias'])}"
                  )


                  print(
                      f"    Distâncias: "
                      f"{len(dados['distancias_declaradas'])}"
                  )


              except Exception as erro:


                  erros += 1


                  print(
                      f"  ! {icao}: {erro}"
                  )


                  print(
                      "    Mantendo dados anteriores."
                  )


              time.sleep(
                  INTERVALO
              )


          # ==========================================
          # NÃO PERMITIR BASE SEM ATUALIZAÇÕES
          # ==========================================

          print()
          print(
              "========================================"
          )

          print(
              "VALIDANDO RESULTADO"
          )

          print(
              "========================================"
          )


          print(
              "Atualizados:",
              atualizados
          )

          print(
              "Erros:",
              erros
          )


          if atualizados == 0:

              raise Exception(
                  "ERRO CRÍTICO: "
                  "nenhum aeródromo foi atualizado."
              )


          # ==========================================
          # SALVAR EM ARQUIVO TEMPORÁRIO
          # ==========================================

          print()
          print(
              "Gravando arquivo temporário:"
          )

          print(
              ARQUIVO_TEMP
          )


          with open(

              ARQUIVO_TEMP,

              "w",

              encoding="utf-8"

          ) as arquivo:


              json.dump(

                  aeroportos,

                  arquivo,

                  ensure_ascii=False,

                  indent=2

              )


              arquivo.write(
                  "\n"
              )


          # ==========================================
          # VALIDAR ARQUIVO TEMPORÁRIO
          # ==========================================

          print()
          print(
              "Validando arquivo temporário..."
          )


          try:

              with open(

                  ARQUIVO_TEMP,

                  "r",

                  encoding="utf-8"

              ) as arquivo:

                  teste = json.load(
                      arquivo
                  )


          except Exception as erro:

              raise Exception(

                  "ERRO CRÍTICO: "
                  "arquivo temporário inválido.\n"
                  + str(erro)

              )


          if not isinstance(
              teste,
              list
          ):

              raise Exception(
                  "ERRO CRÍTICO: "
                  "arquivo temporário não é uma lista."
              )


          if len(teste) < MINIMO_AERODROMOS:

              raise Exception(
                  "ERRO CRÍTICO: "
                  "arquivo temporário possui "
                  "menos registros que o mínimo."
              )


          # ==========================================
          # SUBSTITUIR ARQUIVO ORIGINAL
          # ==========================================

          ARQUIVO_TEMP.replace(
              ARQUIVO
          )


          print()
          print(
              "✓ NOVA BASE VALIDADA E SALVA"
          )


          # ==========================================
          # RESUMO
          # ==========================================

          print()
          print(
              "========================================"
          )

          print(
              "RESUMO FINAL"
          )

          print(
              "========================================"
          )

          print(
              "Total de aeródromos:",
              quantidade
          )

          print(
              "Atualizados:",
              atualizados
          )

          print(
              "Erros:",
              erros
          )

          print(
              "Sem ICAO:",
              sem_icao
          )

          print(
              "Pistas:",
              total_pistas
          )

          print(
              "Frequências:",
              total_frequencias
          )

          print(
              "Distâncias:",
              total_distancias
          )

          print()

          print(
              "✓ PROCESSAMENTO CONCLUÍDO"
          )

          PY


      # ==========================================
      # VERIFICAR ALTERAÇÕES
      # ==========================================

      - name: Verificar alterações
        id: verificar
        run: |

          if git diff --quiet -- data/aeroportos.json; then

            echo "alterado=false" >> "$GITHUB_OUTPUT"

            echo "Nenhuma alteração na base."

          else

            echo "alterado=true" >> "$GITHUB_OUTPUT"

            echo "A base foi alterada."

            git diff --stat -- data/aeroportos.json

          fi


      # ==========================================
      # COMMIT
      # ==========================================

      - name: Commit e push
        if: steps.verificar.outputs.alterado == 'true'
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aeroportos.json

          git commit \
            -m "Atualizar dados dos aeroportos"

          git push


      # ==========================================
      # FINALIZAÇÃO
      # ==========================================

      - name: Finalização
        run: |

          echo
          echo "========================================"
          echo "LEOSPOTTER"
          echo "ATUALIZAÇÃO CONCLUÍDA"
          echo "========================================"
