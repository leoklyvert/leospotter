name: Descobrir arquivos ANAC

on:
  workflow_dispatch:

jobs:
  descobrir:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar diretório ANAC
        run: |
          python - <<'PY'
          import requests

          url = "https://sistemas.anac.gov.br/dadosabertos/Aerodromos/Aer%C3%B3dromos%20P%C3%BAblicos/"

          print("Consultando:")
          print(url)
          print()

          resposta = requests.get(url, timeout=60)

          print("HTTP:", resposta.status_code)
          print()
          print(resposta.text[:20000])
          PY
