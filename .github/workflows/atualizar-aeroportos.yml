name: Atualizar aeroportos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar base de aeroportos
        run: |

          python - <<'PY'

          import json
          import re
          import time
          import urllib.request
          from html import unescape
          from pathlib import Path


          # ==========================================
          # CONFIGURAÇÃO
          # ==========================================

          ARQUIVO = Path("data/aeroportos.json")

          INTERVALO = 0.3

          print("========================================")
          print("ATUALIZAÇÃO DA BASE DE AEROPORTOS")
          print("========================================")
          print()


          # ==========================================
          # LER BASE EXISTENTE
          # ==========================================

          print("Lendo:")
          print(ARQUIVO)
          print()

          with open(
              ARQUIVO,
              "r",
              encoding="utf-8"
          ) as arquivo:

              aeroportos = json.load(
                  arquivo
              )


          print(
              "Aeroportos encontrados:",
              len(aeroportos)
          )


          # ==========================================
          # FUNÇÃO AISWEB
          # ==========================================

          def consultar_aisweb(icao):

              url = (
                  "https://aisweb.decea.mil.br/"
                  "?codigo="
                  + icao
                  + "&i=aerodromos"
              )

              requisicao = urllib.request.Request(

                  url,

                  headers={
                      "User-Agent":
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/120 Safari/537.36"
                  }

              )

              with urllib.request.urlopen(
                  requisicao,
                  timeout=60
              ) as resposta:

                  conteudo = resposta.read()


              texto = conteudo.decode(
                  "utf-8",
                  errors="replace"
              )

              texto = unescape(
                  texto
              )


              # ======================================
              # LIMPAR HTML
              # ======================================

              texto = re.sub(
                  r"<script.*?</script>",
                  " ",
                  texto,
                  flags=re.I | re.S
              )

              texto = re.sub(
                  r"<style.*?</style>",
                  " ",
                  texto,
                  flags=re.I | re.S
              )

              texto = re.sub(
                  r"<br\s*/?>",
                  "\n",
                  texto,
                  flags=re.I
              )

              texto = re.sub(
                  r"</p>|</div>|</tr>|</li>|</h[1-6]>",
                  "\n",
                  texto,
                  flags=re.I
              )

              texto = re.sub(
                  r"<[^>]+>",
                  " ",
                  texto
              )

              texto = re.sub(
                  r"[ \t]+",
                  " ",
                  texto
              )

              texto = re.sub(
                  r"\n\s*\n+",
                  "\n",
                  texto
              )

              texto = texto.strip()

              texto_upper = texto.upper()


              resultado = {

                  "pistas": [],

                  "frequencias": [],

                  "distancias_declaradas": []

              }


              # ======================================
              # PISTA
              # ======================================

              padrao_pista = re.search(

                  r"(\d{2})\s*-\s*.*?"
                  r"\(\s*"
                  r"(\d+)\s*[xX]\s*(\d+)"
                  r"\s+([A-Z0-9]+)"
                  r"\s+([0-9]+/[A-Z0-9/]+)"
                  r".*?"
                  r"\)\s*-\s*.*?"
                  r"-\s*(\d{2})",

                  texto_upper,

                  re.S

              )


              if padrao_pista:

                  resultado["pistas"].append({

                      "designacao":
                      padrao_pista.group(1)
                      + "/"
                      + padrao_pista.group(6),

                      "comprimento":
                      int(
                          padrao_pista.group(2)
                      ),

                      "largura":
                      int(
                          padrao_pista.group(3)
                      ),

                      "superficie":
                      padrao_pista.group(4),

                      "pcr":
                      padrao_pista.group(5)

                  })


              # ======================================
              # FREQUÊNCIAS
              # ======================================

              frequencias = re.findall(

                  r"(?:COM\s*-\s*)?"
                  r"([A-ZÀ-Ú0-9 /-]{2,40})"
                  r"\s+\[\d+\]"
                  r"(?:\s+\[\d+\])*"
                  r"\s+"
                  r"(\d{3}\.\d{3})",

                  texto_upper

              )


              for servico, frequencia in frequencias:

                  servico = servico.strip()


                  existe = any(

                      f["servico"] == servico
                      and
                      f["frequencia"] == frequencia

                      for f in resultado[
                          "frequencias"
                      ]

                  )


                  if not existe:

                      resultado[
                          "frequencias"
                      ].append({

                          "servico":
                          servico,

                          "frequencia":
                          frequencia

                      })


              # ======================================
              # DISTÂNCIAS DECLARADAS
              # ======================================

              padrao_distancias = re.findall(

                  r"\n\s*(\d{2})\s+"
                  r"(\d+)\s+"
                  r"(\d+)\s+"
                  r"(\d+)\s+"
                  r"(\d+)",

                  texto

              )


              for (

                  cabeceira,
                  tora,
                  toda,
                  asda,
                  lda

              ) in padrao_distancias:

                  resultado[
                      "distancias_declaradas"
                  ].append({

                      "rwy":
                      cabeceira,

                      "tora":
                      int(tora),

                      "toda":
                      int(toda),

                      "asda":
                      int(asda),

                      "lda":
                      int(lda)

                  })


              # ======================================
              # VALIDAÇÃO
              # ======================================

              if not resultado["pistas"]:

                  raise Exception(
                      "Nenhuma pista encontrada"
                  )


              return resultado


          # ==========================================
          # PROCESSAMENTO
          # ==========================================

          atualizados = 0
          erros = 0
          sem_icao = 0


          for numero, aeroporto in enumerate(
              aeroportos,
              start=1
          ):

              icao = aeroporto.get(
                  "icao"
              )


              if not icao:

                  sem_icao += 1

                  continue


              icao = str(
                  icao
              ).strip().upper()


              print(
                  f"[{numero}/{len(aeroportos)}] "
                  f"Consultando {icao}..."
              )


              try:

                  dados_aisweb = consultar_aisweb(
                      icao
                  )


                  # ==================================
                  # ATUALIZAR SOMENTE SE DEU CERTO
                  # ==================================

                  aeroporto[
                      "pistas"
                  ] = dados_aisweb[
                      "pistas"
                  ]

                  aeroporto[
                      "frequencias"
                  ] = dados_aisweb[
                      "frequencias"
                  ]

                  aeroporto[
                      "distancias_declaradas"
                  ] = dados_aisweb[
                      "distancias_declaradas"
                  ]


                  atualizados += 1


                  print(
                      f"  ✓ {icao} atualizado"
                  )


              except Exception as erro:

                  erros += 1

                  print(
                      f"  ! {icao}: {erro}"
                  )

                  print(
                      "    Mantendo dados anteriores."
                  )


              time.sleep(
                  INTERVALO
              )


          # ==========================================
          # SALVAR
          # ==========================================

          with open(
              ARQUIVO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  aeroportos,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )

              arquivo.write(
                  "\n"
              )


          # ==========================================
          # RESUMO
          # ==========================================

          print()
          print("========================================")
          print("RESUMO")
          print("========================================")

          print(
              "Total:",
              len(aeroportos)
          )

          print(
              "Atualizados:",
              atualizados
          )

          print(
              "Com erro:",
              erros
          )

          print(
              "Sem ICAO:",
              sem_icao
          )

          print()
          print("Arquivo atualizado:")
          print(ARQUIVO)

          PY


      - name: Verificar alterações
        id: verificar
        run: |

          if git diff --quiet -- data/aeroportos.json; then

            echo "alterado=false" >> "$GITHUB_OUTPUT"

            echo "Nenhuma alteração na base."

          else

            echo "alterado=true" >> "$GITHUB_OUTPUT"

            echo "A base foi alterada."

            git diff --stat -- data/aeroportos.json

          fi


      - name: Commit e push
        if: steps.verificar.outputs.alterado == 'true'
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aeroportos.json

          git commit \
            -m "Atualizar dados dos aeroportos"

          git push

      - name: Finalização
        run: |

          echo "========================================"
          echo "ATUALIZAÇÃO CONCLUÍDA"
          echo "========================================"
