name: Testar base de pistas ANAC

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar e testar pistas
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = (
              "https://sistemas.anac.gov.br/"
              "dadosabertos/Aerodromos/"
              "Aer%C3%B3dromos%20P%C3%BAblicos/"
              "Pistas%20de%20Pouso%20e%20Decolagem/"
              "pda_aerodromos_publicos_pistas_pouso_decolagem.json"
          )

          print("========================================")
          print("TESTE DA BASE DE PISTAS ANAC")
          print("========================================")
          print()

          print("Baixando...")
          print(url)
          print()

          with urllib.request.urlopen(
              url,
              timeout=180
          ) as resposta:

              conteudo = resposta.read()

          print("Download concluído.")
          print(
              "Tamanho:",
              len(conteudo),
              "bytes"
          )

          # ========================================
          # DECODIFICAR UTF-8
          # ========================================

          texto = conteudo.decode(
              "utf-8-sig"
          )

          # ========================================
          # TENTAR JSON NORMAL
          # ========================================

          dados = None

          try:

              dados = json.loads(texto)

              if isinstance(dados, list):

                  print(
                      "Formato detectado: JSON array"
                  )

              else:

                  dados = [dados]

          except json.JSONDecodeError:

              print(
                  "JSON não é um único documento."
              )

              print(
                  "Tentando interpretar como "
                  "JSON por linhas..."
              )

              dados = []

              for numero_linha, linha in enumerate(
                  texto.splitlines(),
                  start=1
              ):

                  linha = linha.strip()

                  if not linha:
                      continue

                  try:

                      registro = json.loads(
                          linha
                      )

                      dados.append(
                          registro
                      )

                  except json.JSONDecodeError as erro:

                      print()
                      print(
                          "Erro na linha:",
                          numero_linha
                      )

                      print(
                          "Conteúdo inicial:"
                      )

                      print(
                          linha[:500]
                      )

                      raise erro

          # ========================================
          # VERIFICAÇÃO
          # ========================================

          if not dados:

              raise Exception(
                  "Nenhum registro encontrado."
              )

          print()
          print(
              "Registros encontrados:",
              len(dados)
          )

          # ========================================
          # PRIMEIRO REGISTRO
          # ========================================

          print()
          print("========================================")
          print("PRIMEIRO REGISTRO")
          print("========================================")
          print()

          print(
              json.dumps(
                  dados[0],
                  ensure_ascii=False,
                  indent=2
              )
          )

          # ========================================
          # PROCURAR MG0009
          # ========================================

          print()
          print("========================================")
          print("PROCURANDO CIAD MG0009")
          print("========================================")
          print()

          encontrados = []

          for item in dados:

              texto_item = json.dumps(
                  item,
                  ensure_ascii=False
              ).upper()

              if "MG0009" in texto_item:

                  encontrados.append(
                      item
                  )

          print(
              "Registros encontrados:",
              len(encontrados)
          )

          if not encontrados:

              raise Exception(
                  "CIAD MG0009 não encontrado."
              )

          # ========================================
          # MOSTRAR RESULTADOS
          # ========================================

          for numero, item in enumerate(
              encontrados,
              start=1
          ):

              print()
              print(
                  f"========== PISTA {numero} =========="
              )

              print()

              print(
                  json.dumps(
                      item,
                      ensure_ascii=False,
                      indent=2
                  )
              )

          print()
          print("========================================")
          print("✓ TESTE CONCLUÍDO COM SUCESSO")
          print("========================================")

          PY
