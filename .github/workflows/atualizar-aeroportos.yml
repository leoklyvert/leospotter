name: Atualizar aeroportos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Atualizar base ANAC e AISWEB
        run: |

          python - <<'PY'

          import csv
          import io
          import json
          import re
          import time
          import urllib.request
          from html import unescape
          from pathlib import Path


          # ==================================================
          # CONFIGURACAO
          # ==================================================

          ARQUIVO = Path("data/aeroportos.json")

          URL_SIROS = (
              "https://siros.anac.gov.br/"
              "siros/registros/aerodromo/aerodromos.csv"
          )

          MINIMO_REGISTROS = 8000

          INTERVALO = 0.30


          print("========================================")
          print("LEOSPOTTER")
          print("ATUALIZACAO ANAC + AISWEB")
          print("========================================")
          print()


          # ==================================================
          # FUNCOES AUXILIARES
          # ==================================================

          def normalizar(valor):

              if valor is None:
                  return ""

              return str(valor).replace(
                  "\ufeff",
                  ""
              ).strip()


          def chave_coluna(valor):

              valor = normalizar(
                  valor
              ).upper()

              substituicoes = {
                  "Á": "A",
                  "À": "A",
                  "Ã": "A",
                  "Â": "A",
                  "É": "E",
                  "Ê": "E",
                  "Í": "I",
                  "Ó": "O",
                  "Ô": "O",
                  "Õ": "O",
                  "Ú": "U",
                  "Ç": "C"
              }

              for antigo, novo in substituicoes.items():

                  valor = valor.replace(
                      antigo,
                      novo
                  )

              return re.sub(
                  r"[^A-Z0-9]+",
                  "_",
                  valor
              ).strip("_")


          def obter_campo(
              registro,
              mapa,
              *nomes
          ):

              for nome in nomes:

                  chave = chave_coluna(
                      nome
                  )

                  coluna = mapa.get(
                      chave
                  )

                  if coluna is not None:

                      valor = normalizar(
                          registro.get(
                              coluna,
                              ""
                          )
                      )

                      if valor:
                          return valor

              return ""


          def limpar_html(conteudo):

              texto = conteudo.decode(
                  "utf-8",
                  errors="replace"
              )

              texto = unescape(
                  texto
              )

              texto = re.sub(
                  r"<script.*?</script>",
                  " ",
                  texto,
                  flags=re.I | re.S
              )

              texto = re.sub(
                  r"<style.*?</style>",
                  " ",
                  texto,
                  flags=re.I | re.S
              )

              texto = re.sub(
                  r"<br\s*/?>",
                  "\n",
                  texto,
                  flags=re.I
              )

              texto = re.sub(
                  r"</p>|</div>|</tr>|</li>|</h[1-6]>",
                  "\n",
                  texto,
                  flags=re.I
              )

              texto = re.sub(
                  r"<[^>]+>",
                  " ",
                  texto
              )

              texto = re.sub(
                  r"[ \t]+",
                  " ",
                  texto
              )

              texto = re.sub(
                  r"\n\s*\n+",
                  "\n",
                  texto
              )

              return texto.strip()


          # ==================================================
          # CONSULTA AISWEB
          # ==================================================

          def consultar_aisweb(icao):

              url = (
                  "https://aisweb.decea.mil.br/"
                  "?codigo="
                  + icao
                  + "&i=aerodromos"
              )


              requisicao = urllib.request.Request(

                  url,

                  headers={
                      "User-Agent":
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/120 Safari/537.36"
                  }

              )


              with urllib.request.urlopen(
                  requisicao,
                  timeout=60
              ) as resposta:

                  conteudo = resposta.read()

                  status = resposta.status


              if status != 200:

                  raise Exception(
                      "HTTP "
                      + str(status)
                  )


              if len(conteudo) < 1000:

                  raise Exception(
                      "Resposta AISWEB muito pequena"
                  )


              texto = limpar_html(
                  conteudo
              )

              texto_upper = texto.upper()


              resultado = {

                  "pistas": [],

                  "frequencias": [],

                  "distancias_declaradas": [],

                  "atualizacao": None

              }


              # ==================================================
              # PISTAS
              # ==================================================

              pistas = re.findall(

                  r"(\d{2})\s*-\s*.*?"
                  r"\(\s*"
                  r"(\d+)\s*[xX]\s*(\d+)"
                  r"\s+([A-Z0-9]+)"
                  r"\s+([0-9]+/[A-Z0-9/]+)"
                  r".*?"
                  r"\)\s*-\s*.*?"
                  r"-\s*(\d{2})",

                  texto_upper,

                  re.S

              )


              for pista in pistas:

                  item = {

                      "identificacao":
                      pista[0]
                      + "/"
                      + pista[5],

                      "piso":
                      pista[3],

                      "dimensoes":
                      pista[1]
                      + " x "
                      + pista[2]
                      + " m",

                      "resistencia":
                      pista[4]

                  }


                  if item not in resultado[
                      "pistas"
                  ]:

                      resultado[
                          "pistas"
                      ].append(
                          item
                      )


              # ==================================================
              # FREQUENCIAS
              # ==================================================

              frequencias = re.findall(

                  r"(?:COM\s*-\s*)?"
                  r"([A-ZÀ-Ú0-9 /-]{2,40})"
                  r"\s+\[\d+\]"
                  r"(?:\s+\[\d+\])*"
                  r"\s+"
                  r"(\d{3}\.\d{3})",

                  texto_upper

              )


              for servico, frequencia in frequencias:

                  item = {

                      "orgao":
                      servico.strip(),

                      "valor":
                      frequencia,

                      "observacao":
                      ""

                  }


                  if item not in resultado[
                      "frequencias"
                  ]:

                      resultado[
                          "frequencias"
                      ].append(
                          item
                      )


              # ==================================================
              # DISTANCIAS DECLARADAS
              # ==================================================

              distancias = re.findall(

                  r"\b(\d{2})\s+"
                  r"(\d{3,5})\s+"
                  r"(\d{3,5})\s+"
                  r"(\d{3,5})\s+"
                  r"(\d{3,5})\b",

                  texto

              )


              for (

                  rwy,
                  tora,
                  toda,
                  asda,
                  lda

              ) in distancias:

                  item = {

                      "rwy":
                      rwy,

                      "tora":
                      int(tora),

                      "toda":
                      int(toda),

                      "asda":
                      int(asda),

                      "lda":
                      int(lda)

                  }


                  if item not in resultado[
                      "distancias_declaradas"
                  ]:

                      resultado[
                          "distancias_declaradas"
                      ].append(
                          item
                      )


              # ==================================================
              # DATA DE ATUALIZACAO
              # ==================================================

              data = re.search(

                  r"ÚLTIMA ATUALIZAÇÃO\s*:\s*"
                  r"(\d{2}/\d{2}/\d{4})",

                  texto_upper

              )


              if data:

                  resultado[
                      "atualizacao"
                  ] = data.group(1)


              return resultado


          # ==================================================
          # BAIXAR BASE SIROS
          # ==================================================

          print("========================================")
          print("BAIXANDO BASE ANAC / SIROS")
          print("========================================")
          print()

          print(
              "URL:",
              URL_SIROS
          )

          print()


          requisicao = urllib.request.Request(

              URL_SIROS,

              headers={
                  "User-Agent":
                  "Mozilla/5.0 "
                  "(Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/120 Safari/537.36"
              }

          )


          with urllib.request.urlopen(
              requisicao,
              timeout=120
          ) as resposta:

              dados_csv = resposta.read()

              status = resposta.status


          print(
              "HTTP:",
              status
          )

          print(
              "Bytes:",
              len(dados_csv)
          )

          print()


          if status != 200:

              raise Exception(
                  "ANAC retornou HTTP "
                  + str(status)
              )


          if len(dados_csv) < 100000:

              raise Exception(
                  "Arquivo ANAC inesperadamente pequeno."
              )


          texto_csv = dados_csv.decode(
              "utf-8-sig"
          )


          primeira_linha = (
              texto_csv
              .splitlines()[0]
          )


          if ";" in primeira_linha:

              separador = ";"

          elif "," in primeira_linha:

              separador = ","

          else:

              raise Exception(
                  "Separador CSV nao identificado."
              )


          leitor = csv.DictReader(

              io.StringIO(
                  texto_csv
              ),

              delimiter=separador

          )


          colunas = (
              leitor.fieldnames
              or []
          )


          registros = list(
              leitor
          )


          print(
              "Separador:",
              repr(separador)
          )

          print(
              "Registros brutos:",
              len(registros)
          )

          print()


          if len(registros) < MINIMO_REGISTROS:

              raise Exception(

                  "ERRO CRITICO: base ANAC possui "
                  + str(len(registros))
                  + " registros. "
                  + "Minimo esperado: "
                  + str(MINIMO_REGISTROS)

              )


          mapa_colunas = {

              chave_coluna(coluna):
              coluna

              for coluna in colunas

          }


          # ==================================================
          # LER BASE ANTERIOR
          # ==================================================

          base_anterior = {}


          if ARQUIVO.exists():

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados_antigos = json.load(
                          arquivo
                      )


                  if isinstance(
                      dados_antigos,
                      list
                  ):

                      for item in dados_antigos:

                          if not isinstance(
                              item,
                              dict
                          ):

                              continue


                          icao = normalizar(

                              item.get(
                                  "icao",
                                  ""
                              )

                          ).upper()


                          if re.fullmatch(
                              r"[A-Z]{4}",
                              icao
                          ):

                              base_anterior[
                                  icao
                              ] = item


              except Exception as erro:

                  print(
                      "Aviso: nao foi possivel "
                      "ler a base anterior:"
                  )

                  print(
                      erro
                  )


          print(
              "Registros anteriores:",
              len(base_anterior)
          )

          print()


          # ==================================================
          # CONSTRUIR BASE ANAC
          # ==================================================

          nova_base = []

          vistos = set()

          sem_icao = 0

          duplicados = 0


          for registro in registros:

              icao = obter_campo(

                  registro,
                  mapa_colunas,

                  "SIGLA ICAO AERÓDROMO",
                  "SIGLA ICAO",
                  "ICAO",
                  "OACI"

              ).upper()


              if not re.fullmatch(
                  r"[A-Z]{4}",
                  icao
              ):

                  sem_icao += 1

                  continue


              if icao in vistos:

                  duplicados += 1

                  continue


              vistos.add(
                  icao
              )


              anterior = base_anterior.get(
                  icao,
                  {}
              )


              aeroporto = {

                  "icao":
                  icao,

                  "iata":
                  obter_campo(

                      registro,
                      mapa_colunas,

                      "SIGLA IATA AERÓDROMO",
                      "SIGLA IATA",
                      "IATA"

                  ),

                  "nome":
                  obter_campo(

                      registro,
                      mapa_colunas,

                      "NOME AERÓDROMO",
                      "NOME"

                  ),

                  "municipio":
                  obter_campo(

                      registro,
                      mapa_colunas,

                      "MUNICÍPIO AERÓDROMO",
                      "MUNICIPIO AERODROMO",
                      "MUNICÍPIO",
                      "MUNICIPIO"

                  ),

                  "uf":
                  obter_campo(

                      registro,
                      mapa_colunas,

                      "ESTADO AERÓDROMO",
                      "ESTADO",
                      "UF"

                  ),

                  "pais":
                  obter_campo(

                      registro,
                      mapa_colunas,

                      "PAÍS AERÓDROMO",
                      "PAIS AERODROMO",
                      "PAÍS",
                      "PAIS"

                  ),

                  "aeronave_critica":
                  obter_campo(

                      registro,
                      mapa_colunas,

                      "AERONAVE CRÍTICA",
                      "AERONAVE CRITICA"

                  ),

                  "latitude":
                  obter_campo(

                      registro,
                      mapa_colunas,

                      "LATITUDE"

                  ),

                  "longitude":
                  obter_campo(

                      registro,
                      mapa_colunas,

                      "LONGITUDE"

                  ),

                  "pistas":
                  anterior.get(
                      "pistas",
                      []
                  ),

                  "frequencias":
                  anterior.get(
                      "frequencias",
                      []
                  ),

                  "distancias_declaradas":
                  anterior.get(
                      "distancias_declaradas",
                      []
                  )

              }


              nova_base.append(
                  aeroporto
              )


          print("========================================")
          print("BASE ANAC")
          print("========================================")
          print()

          print(
              "Registros brutos:",
              len(registros)
          )

          print(
              "ICAOs validos:",
              len(nova_base)
          )

          print(
              "Duplicados:",
              duplicados
          )

          print(
              "Sem ICAO:",
              sem_icao
          )

          print()


          if len(nova_base) < MINIMO_REGISTROS:

              raise Exception(

                  "ERRO CRITICO: somente "
                  + str(len(nova_base))
                  + " aerodromos validos."

              )


          # ==================================================
          # CONSULTAR AISWEB
          # ==================================================

          print("========================================")
          print("CONSULTANDO AISWEB")
          print("========================================")
          print()


          total = len(
              nova_base
          )

          consultados = 0

          atualizados = 0

          falhas = 0

          sem_pista = 0

          sem_frequencia = 0


          for numero, aeroporto in enumerate(

              nova_base,
              start=1

          ):

              icao = aeroporto[
                  "icao"
              ]


              try:

                  dados = consultar_aisweb(
                      icao
                  )


                  consultados += 1


                  if dados[
                      "pistas"
                  ]:

                      aeroporto[
                          "pistas"
                      ] = dados[
                          "pistas"
                      ]

                  else:

                      sem_pista += 1


                  if dados[
                      "frequencias"
                  ]:

                      aeroporto[
                          "frequencias"
                      ] = dados[
                          "frequencias"
                      ]

                  else:

                      sem_frequencia += 1


                  if dados[
                      "distancias_declaradas"
                  ]:

                      aeroporto[
                          "distancias_declaradas"
                      ] = dados[
                          "distancias_declaradas"
                      ]


                  if dados[
                      "atualizacao"
                  ]:

                      aeroporto[
                          "atualizacao_aisweb"
                      ] = dados[
                          "atualizacao"
                      ]


                  if (

                      dados["pistas"]
                      or
                      dados["frequencias"]

                  ):

                      atualizados += 1


                  print(

                      f"[{numero}/{total}] "
                      f"{icao} "
                      f"OK | "
                      f"pistas={len(dados['pistas'])} "
                      f"freq={len(dados['frequencias'])} "
                      f"dist={len(dados['distancias_declaradas'])}"

                  )


              except Exception as erro:

                  falhas += 1


                  print(

                      f"[{numero}/{total}] "
                      f"{icao} "
                      f"ERRO | "
                      f"{erro} | "
                      f"dados anteriores mantidos"

                  )


              time.sleep(
                  INTERVALO
              )


          # ==================================================
          # VALIDAR SBUR
          # ==================================================

          sbur = None


          for aeroporto in nova_base:

              if aeroporto[
                  "icao"
              ] == "SBUR":

                  sbur = aeroporto

                  break


          if sbur is None:

              raise Exception(
                  "SBUR nao encontrado na base."
              )


          print()
          print("========================================")
          print("VALIDACAO SBUR")
          print("========================================")
          print()


          print(
              json.dumps(
                  sbur,
                  ensure_ascii=False,
                  indent=2
              )
          )


          # ==================================================
          # VALIDAR SSCL
          # ==================================================

          sscl = None


          for aeroporto in nova_base:

              if aeroporto[
                  "icao"
              ] == "SSCL":

                  sscl = aeroporto

                  break


          print()
          print("========================================")
          print("VALIDACAO SSCL - CASSILANDIA")
          print("========================================")
          print()


          if sscl is None:

              print(
                  "AVISO: SSCL nao encontrado "
                  "na base ANAC/SIROS."
              )

          else:

              print(
                  json.dumps(
                      sscl,
                      ensure_ascii=False,
                      indent=2
                  )
              )


          # ==================================================
          # SALVAR
          # ==================================================

          with open(

              ARQUIVO,
              "w",
              encoding="utf-8"

          ) as arquivo:

              json.dump(

                  nova_base,
                  arquivo,

                  ensure_ascii=False,
                  indent=2

              )

              arquivo.write(
                  "\n"
              )


          # ==================================================
          # VALIDAR JSON FINAL
          # ==================================================

          with open(

              ARQUIVO,
              "r",
              encoding="utf-8"

          ) as arquivo:

              teste = json.load(
                  arquivo
              )


          if not isinstance(
              teste,
              list
          ):

              raise Exception(
                  "JSON final invalido."
              )


          if len(teste) < MINIMO_REGISTROS:

              raise Exception(

                  "ERRO CRITICO: "
                  "JSON final possui somente "
                  + str(len(teste))
                  + " registros."

              )


          # ==================================================
          # RESUMO
          # ==================================================

          print()
          print("========================================")
          print("RESUMO")
          print("========================================")
          print()

          print(
              "Aerodromos:",
              total
          )

          print(
              "Consultados AISWEB:",
              consultados
          )

          print(
              "Atualizados:",
              atualizados
          )

          print(
              "Falhas AISWEB:",
              falhas
          )

          print(
              "Sem pista:",
              sem_pista
          )

          print(
              "Sem frequencia:",
              sem_frequencia
          )

          print()

          print(
              "Arquivo:",
              ARQUIVO
          )

          print()
          print("========================================")
          print("ATUALIZACAO CONCLUIDA")
          print("========================================")

          PY


      - name: Verificar alteracoes
        id: verificar
        run: |

          if git diff --quiet -- data/aeroportos.json; then

            echo "alterado=false" >> "$GITHUB_OUTPUT"

            echo "Nenhuma alteracao na base."

          else

            echo "alterado=true" >> "$GITHUB_OUTPUT"

            echo "A base foi alterada."

            git diff --stat -- data/aeroportos.json

          fi


      - name: Commit e push
        if: steps.verificar.outputs.alterado == 'true'
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aeroportos.json

          git commit \
            -m "Atualizar dados ANAC e AISWEB"

          git push


      - name: Finalizacao
        run: |

          echo "========================================"
          echo "LEOSPOTTER"
          echo "ATUALIZACAO CONCLUIDA"
          echo "========================================"
