name: Atualizar aeroportos

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:

  atualizar:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Baixar repositório

        uses: actions/checkout@v4


      # ============================================================
      # ATUALIZAR BASE
      # ============================================================

      - name: Atualizar base de aeroportos

        run: |

          python - <<'PY'

          import csv
          import io
          import json
          import re
          import time
          import urllib.request
          from html import unescape
          from pathlib import Path
          from datetime import datetime


          # ============================================================
          # CONFIGURAÇÃO
          # ============================================================

          ARQUIVO = Path("data/aeroportos.json")

          URL_SIROS = (
              "https://siros.anac.gov.br/"
              "siros/registros/aerodromo/aerodromos.csv"
          )

          # ------------------------------------------------------------
          # Aeródromos prioritários
          # ------------------------------------------------------------

          PRIORITARIOS = [

              "SSCL",   # Cassilândia
              "SBUR",   # Uberaba

          ]

          # ------------------------------------------------------------
          # Quantidade máxima de consultas AISWEB nesta execução
          # ------------------------------------------------------------

          LIMITE_AISWEB = 100

          INTERVALO = 0.5

          DATA_ATUALIZACAO = datetime.utcnow().strftime(
              "%Y-%m-%d"
          )


          print("========================================")
          print("LEOSPOTTER")
          print("ATUALIZAÇÃO DA BASE DE AERÓDROMOS")
          print("========================================")
          print()

          print(
              "Data:",
              DATA_ATUALIZACAO
          )

          print(
              "Limite AISWEB:",
              LIMITE_AISWEB
          )

          print()


          # ============================================================
          # FUNÇÃO DOWNLOAD
          # ============================================================

          def baixar(url):

              requisicao = urllib.request.Request(

                  url,

                  headers={
                      "User-Agent":
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/120 Safari/537.36"
                  }

              )

              with urllib.request.urlopen(
                  requisicao,
                  timeout=60
              ) as resposta:

                  conteudo = resposta.read()

                  status = resposta.status

              return status, conteudo


          # ============================================================
          # LER BASE EXISTENTE
          # ============================================================

          print("========================================")
          print("BASE EXISTENTE")
          print("========================================")
          print()

          if not ARQUIVO.exists():

              raise Exception(
                  "Arquivo data/aeroportos.json não encontrado."
              )


          tamanho = ARQUIVO.stat().st_size

          print(
              "Tamanho:",
              tamanho,
              "bytes"
          )


          if tamanho < 1000:

              raise Exception(
                  "ERRO CRÍTICO: aeroportos.json parece vazio."
              )


          try:

              with open(
                  ARQUIVO,
                  "r",
                  encoding="utf-8"
              ) as arquivo:

                  aeroportos = json.load(arquivo)

          except Exception as erro:

              raise Exception(
                  "ERRO CRÍTICO ao ler aeroportos.json: "
                  + str(erro)
              )


          if not isinstance(
              aeroportos,
              list
          ):

              raise Exception(
                  "ERRO CRÍTICO: aeroportos.json não contém uma lista."
              )


          print(
              "Registros existentes:",
              len(aeroportos)
          )

          print()


          # ============================================================
          # ÍNDICE DA BASE EXISTENTE
          # ============================================================

          indice = {}


          for aeroporto in aeroportos:

              icao = aeroporto.get("icao")

              if not icao:
                  continue

              icao = str(
                  icao
              ).strip().upper()

              aeroporto["icao"] = icao

              indice[icao] = aeroporto


          print(
              "ICAOs indexados:",
              len(indice)
          )

          print()


          # ============================================================
          # BAIXAR SIROS
          # ============================================================

          print("========================================")
          print("ANAC / SIROS")
          print("========================================")
          print()

          print(
              "Baixando:",
              URL_SIROS
          )

          status, conteudo = baixar(
              URL_SIROS
          )

          print(
              "HTTP:",
              status
          )

          print(
              "Bytes:",
              len(conteudo)
          )

          print()


          # ============================================================
          # INTERPRETAR CSV
          # ============================================================

          texto_csv = conteudo.decode(
              "utf-8-sig",
              errors="replace"
          )

          leitor = csv.DictReader(
              io.StringIO(texto_csv),
              delimiter=";"
          )

          registros_siros = list(
              leitor
          )


          print(
              "Registros SIROS:",
              len(registros_siros)
          )

          print()


          # ============================================================
          # LOCALIZAR COLUNAS
          # ============================================================

          def coluna(
              registro,
              nomes
          ):

              for nome in nomes:

                  if nome in registro:
                      return registro.get(nome)

              return ""


          # ============================================================
          # ATUALIZAR CADASTRO ANAC
          # ============================================================

          novos = 0
          atualizados_anac = 0
          sem_icao = 0


          for registro in registros_siros:

              icao = coluna(
                  registro,
                  [
                      "SIGLA ICAO AERÓDROMO",
                      "ICAO",
                      "ICAO AERÓDROMO"
                  ]
              )


              if not icao:

                  sem_icao += 1

                  continue


              icao = str(
                  icao
              ).strip().upper()


              # --------------------------------------------------------
              # Alguns registros podem possuir valores inválidos
              # --------------------------------------------------------

              if not re.fullmatch(
                  r"[A-Z0-9]{4}",
                  icao
              ):

                  sem_icao += 1

                  continue


              nome = coluna(
                  registro,
                  [
                      "NOME AERÓDROMO"
                  ]
              ).strip()


              iata = coluna(
                  registro,
                  [
                      "SIGLA IATA AERÓDROMO"
                  ]
              ).strip()


              municipio = coluna(
                  registro,
                  [
                      "MUNICÍPIO AERÓDROMO"
                  ]
              ).strip()


              uf = coluna(
                  registro,
                  [
                      "ESTADO AERÓDROMO"
                  ]
              ).strip()


              pais = coluna(
                  registro,
                  [
                      "PAÍS AERÓDROMO"
                  ]
              ).strip()


              latitude = coluna(
                  registro,
                  [
                      "LATITUDE"
                  ]
              ).strip()


              longitude = coluna(
                  registro,
                  [
                      "LONGITUDE"
                  ]
              ).strip()


              if icao in indice:

                  aeroporto = indice[
                      icao
                  ]

                  if nome:
                      aeroporto["nome"] = nome

                  if iata:
                      aeroporto["iata"] = iata

                  if municipio:
                      aeroporto["municipio"] = municipio

                  if uf:
                      aeroporto["uf"] = uf

                  if pais:
                      aeroporto["pais"] = pais

                  if latitude:
                      aeroporto["latitude"] = latitude

                  if longitude:
                      aeroporto["longitude"] = longitude

                  atualizados_anac += 1


              else:

                  aeroporto = {

                      "icao": icao,

                      "iata": iata,

                      "nome": nome,

                      "municipio": municipio,

                      "uf": uf,

                      "pais": pais,

                      "latitude": latitude,

                      "longitude": longitude,

                      "pistas": [],

                      "frequencias": [],

                      "distancias_declaradas": [],

                      "ultima_atualizacao_aisweb": None

                  }


                  aeroportos.append(
                      aeroporto
                  )

                  indice[
                      icao
                  ] = aeroporto

                  novos += 1


          print(
              "Novos aeródromos:",
              novos
          )

          print(
              "Registros ANAC atualizados:",
              atualizados_anac
          )

          print(
              "Sem ICAO:",
              sem_icao
          )

          print()


          # ============================================================
          # FUNÇÃO AISWEB
          # ============================================================

          def consultar_aisweb(
              icao
          ):

              url = (

                  "https://aisweb.decea.mil.br/"
                  "?codigo="
                  + icao
                  + "&i=aerodromos"

              )


              requisicao = urllib.request.Request(

                  url,

                  headers={
                      "User-Agent":
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/120 Safari/537.36"
                  }

              )


              with urllib.request.urlopen(
                  requisicao,
                  timeout=60
              ) as resposta:

                  conteudo = resposta.read()


              texto = conteudo.decode(
                  "utf-8",
                  errors="replace"
              )


              texto = unescape(
                  texto
              )


              # --------------------------------------------------------
              # LIMPEZA HTML
              # --------------------------------------------------------

              texto = re.sub(
                  r"<script.*?</script>",
                  " ",
                  texto,
                  flags=re.I | re.S
              )


              texto = re.sub(
                  r"<style.*?</style>",
                  " ",
                  texto,
                  flags=re.I | re.S
              )


              texto = re.sub(
                  r"<br\s*/?>",
                  "\n",
                  texto,
                  flags=re.I
              )


              texto = re.sub(
                  r"</p>|</div>|</tr>|</li>|</h[1-6]>",
                  "\n",
                  texto,
                  flags=re.I
              )


              texto = re.sub(
                  r"<[^>]+>",
                  " ",
                  texto
              )


              texto = re.sub(
                  r"[ \t]+",
                  " ",
                  texto
              )


              texto = re.sub(
                  r"\n\s*\n+",
                  "\n",
                  texto
              )


              texto = texto.strip()

              texto_upper = texto.upper()


              resultado = {

                  "pistas": [],

                  "frequencias": [],

                  "distancias_declaradas": [],

                  "atualizacao": None

              }


              # ========================================================
              # PISTAS
              # ========================================================

              padrao_pista = re.search(

                  r"(\d{2})\s*-\s*.*?"
                  r"\(\s*"
                  r"(\d+)\s*[xX]\s*(\d+)"
                  r"\s+([A-Z0-9]+)"
                  r"\s+([0-9]+/[A-Z0-9/]+)"
                  r".*?"
                  r"\)\s*-\s*.*?"
                  r"-\s*(\d{2})",

                  texto_upper,

                  re.S

              )


              if padrao_pista:

                  resultado[
                      "pistas"
                  ].append({

                      "identificacao":

                          padrao_pista.group(1)
                          + "/"
                          + padrao_pista.group(6),

                      "piso":

                          padrao_pista.group(4),

                      "dimensoes":

                          padrao_pista.group(2)
                          + " x "
                          + padrao_pista.group(3)
                          + " m",

                      "resistencia":

                          padrao_pista.group(5)

                  })


              # ========================================================
              # FREQUÊNCIAS
              # ========================================================

              frequencias = re.findall(

                  r"(?:COM\s*-\s*)?"
                  r"([A-ZÀ-Ú0-9 /-]{2,40})"
                  r"\s+\[\d+\]"
                  r"(?:\s+\[\d+\])*"
                  r"\s+"
                  r"(\d{3}\.\d{3})",

                  texto_upper

              )


              for servico, frequencia in frequencias:

                  servico = servico.strip()


                  existe = any(

                      f.get("orgao") == servico
                      and
                      f.get("valor") == frequencia

                      for f in resultado[
                          "frequencias"
                      ]

                  )


                  if not existe:

                      resultado[
                          "frequencias"
                      ].append({

                          "orgao": servico,

                          "valor": frequencia,

                          "observacao": ""

                      })


              # ========================================================
              # DISTÂNCIAS DECLARADAS
              # ========================================================

              padroes = [

                  r"(\d{2})\s+"
                  r"(\d{3,5})\s+"
                  r"(\d{3,5})\s+"
                  r"(\d{3,5})\s+"
                  r"(\d{3,5})",

                  r"(\d{2})\s*"
                  r"(\d{3,5})\s*"
                  r"(\d{3,5})\s*"
                  r"(\d{3,5})\s*"
                  r"(\d{3,5})"

              ]


              encontrados = []


              for padrao in padroes:

                  encontrados.extend(

                      re.findall(
                          padrao,
                          texto
                      )

                  )


              vistos = set()


              for (

                  cabeceira,
                  tora,
                  toda,
                  asda,
                  lda

              ) in encontrados:


                  chave = (

                      cabeceira,
                      tora,
                      toda,
                      asda,
                      lda

                  )


                  if chave in vistos:
                      continue


                  vistos.add(
                      chave
                  )


                  resultado[
                      "distancias_declaradas"
                  ].append({

                      "rwy":
                      cabeceira,

                      "tora":
                      int(tora),

                      "toda":
                      int(toda),

                      "asda":
                      int(asda),

                      "lda":
                      int(lda)

                  })


              # ========================================================
              # DATA AISWEB
              # ========================================================

              padrao_data = re.search(

                  r"ÚLTIMA ATUALIZAÇÃO:\s*"
                  r"(\d{2}/\d{2}/\d{4})",

                  texto_upper

              )


              if padrao_data:

                  resultado[
                      "atualizacao"
                  ] = padrao_data.group(1)


              # ========================================================
              # VALIDAÇÃO
              # ========================================================

              if not resultado[
                  "pistas"
              ]:

                  raise Exception(
                      "Nenhuma pista encontrada"
                  )


              if not resultado[
                  "frequencias"
              ]:

                  raise Exception(
                      "Nenhuma frequência encontrada"
                  )


              return resultado


          # ============================================================
          # DEFINIR QUEM SERÁ CONSULTADO
          # ============================================================

          candidatos_prioritarios = []

          candidatos_normais = []


          for icao, aeroporto in indice.items():

              if icao in PRIORITARIOS:

                  candidatos_prioritarios.append(
                      aeroporto
                  )

              else:

                  candidatos_normais.append(
                      aeroporto
                  )


          # ------------------------------------------------------------
          # Prioritários sempre entram primeiro
          # ------------------------------------------------------------

          candidatos = (

              candidatos_prioritarios
              +
              candidatos_normais

          )


          candidatos = candidatos[
              :LIMITE_AISWEB
          ]


          print("========================================")
          print("ATUALIZAÇÃO AISWEB")
          print("========================================")
          print()

          print(
              "Prioritários:",
              ", ".join(PRIORITARIOS)
          )

          print(
              "Consultas nesta execução:",
              len(candidatos)
          )

          print()


          # ============================================================
          # PROCESSAR AISWEB
          # ============================================================

          sucesso = 0
          erros = 0
          pistas_total = 0
          frequencias_total = 0
          distancias_total = 0


          for numero, aeroporto in enumerate(
              candidatos,
              start=1
          ):

              icao = aeroporto[
                  "icao"
              ]


              print(
                  f"[{numero}/{len(candidatos)}] "
                  f"AISWEB {icao}..."
              )


              try:

                  dados = consultar_aisweb(
                      icao
                  )


                  # ----------------------------------------------------
                  # Atualizar somente se a consulta for válida
                  # ----------------------------------------------------

                  aeroporto[
                      "pistas"
                  ] = dados[
                      "pistas"
                  ]


                  aeroporto[
                      "frequencias"
                  ] = dados[
                      "frequencias"
                  ]


                  aeroporto[
                      "distancias_declaradas"
                  ] = dados[
                      "distancias_declaradas"
                  ]


                  aeroporto[
                      "ultima_atualizacao_aisweb"
                  ] = (

                      dados[
                          "atualizacao"
                      ]

                      or

                      DATA_ATUALIZACAO

                  )


                  sucesso += 1


                  pistas_total += len(
                      dados[
                          "pistas"
                      ]
                  )


                  frequencias_total += len(
                      dados[
                          "frequencias"
                      ]
                  )


                  distancias_total += len(
                      dados[
                          "distancias_declaradas"
                      ]
                  )


                  print(
                      "  ✓ atualizado"
                  )


                  print(
                      "    Pistas:",
                      len(
                          dados[
                              "pistas"
                          ]
                      )
                  )


                  print(
                      "    Frequências:",
                      len(
                          dados[
                              "frequencias"
                          ]
                      )
                  )


                  print(
                      "    Distâncias:",
                      len(
                          dados[
                              "distancias_declaradas"
                          ]
                      )
                  )


              except Exception as erro:

                  erros += 1


                  print(
                      "  ! erro:",
                      erro
                  )


                  print(
                      "    Dados anteriores preservados."
                  )


              time.sleep(
                  INTERVALO
              )


          # ============================================================
          # ORDENAR BASE
          # ============================================================

          aeroportos.sort(

              key=lambda x:
              str(
                  x.get(
                      "icao",
                      ""
                  )
              )

          )


          # ============================================================
          # SALVAR
          # ============================================================

          with open(

              ARQUIVO,

              "w",

              encoding="utf-8"

          ) as arquivo:

              json.dump(

                  aeroportos,

                  arquivo,

                  ensure_ascii=False,

                  indent=2

              )

              arquivo.write(
                  "\n"
              )


          # ============================================================
          # RESUMO
          # ============================================================

          print()

          print("========================================")
          print("RESUMO")
          print("========================================")

          print(
              "Total de aeródromos:",
              len(aeroportos)
          )

          print(
              "Consultas AISWEB:",
              len(candidatos)
          )

          print(
              "AISWEB com sucesso:",
              sucesso
          )

          print(
              "AISWEB com erro:",
              erros
          )

          print(
              "Novos registros ANAC:",
              novos
          )

          print(
              "Pistas obtidas:",
              pistas_total
          )

          print(
              "Frequências obtidas:",
              frequencias_total
          )

          print(
              "Distâncias obtidas:",
              distancias_total
          )

          print()

          # ============================================================
          # VALIDAÇÕES CRÍTICAS
          # ============================================================

          if len(aeroportos) < 7000:

              raise Exception(

                  "ERRO CRÍTICO: base possui apenas "
                  + str(len(aeroportos))
                  + " registros."

              )


          if "SSCL" not in indice:

              raise Exception(
                  "ERRO CRÍTICO: SSCL não encontrado."
              )


          if "SBUR" not in indice:

              raise Exception(
                  "ERRO CRÍTICO: SBUR não encontrado."
              )


          print(
              "✓ SSCL presente"
          )

          print(
              "✓ SBUR presente"
          )

          print()

          print(
              "========================================"
          )

          print(
              "✓ ATUALIZAÇÃO CONCLUÍDA"
          )

          print(
              "========================================"


          PY


      # ============================================================
      # VERIFICAR ALTERAÇÕES
      # ============================================================

      - name: Verificar alterações

        id: verificar

        run: |

          if git diff --quiet -- data/aeroportos.json; then

            echo "alterado=false" >> "$GITHUB_OUTPUT"

            echo "Nenhuma alteração."

          else

            echo "alterado=true" >> "$GITHUB_OUTPUT"

            echo "Base alterada."

            git diff --stat -- data/aeroportos.json

          fi


      # ============================================================
      # COMMIT
      # ============================================================

      - name: Commit e push

        if: steps.verificar.outputs.alterado == 'true'

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aeroportos.json

          git commit \
            -m "Atualizar base de aeroportos"

          git push


      # ============================================================
      # FINALIZAÇÃO
      # ============================================================

      - name: Finalização

        run: |

          echo "========================================"

          echo "LEOSPOTTER"

          echo "ATUALIZAÇÃO FINALIZADA"

          echo "========================================"
