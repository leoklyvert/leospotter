# atualizar-aeroportos.yml

```yaml
name: Atualizar aeroportos

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Atualizar base de aeroportos
        run: python scripts/atualizar_aeroportos.py

      - name: Verificar alterações
        id: verificar
        run: |
          if git diff --quiet -- data/aeroportos.json data/aeroportos_cursor.json; then
            echo "alterado=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma alteração."
          else
            echo "alterado=true" >> "$GITHUB_OUTPUT"
            echo "Base alterada."
            git diff --stat -- data/aeroportos.json data/aeroportos_cursor.json
          fi

      - name: Commit e push
        if: steps.verificar.outputs.alterado == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aeroportos.json data/aeroportos_cursor.json

          git commit -m "Atualizar base de aeroportos"

          git push

      - name: Finalização
        run: |
          echo "========================================"
          echo "LEOSPOTTER"
          echo "ATUALIZAÇÃO FINALIZADA"
          echo "========================================"
```
