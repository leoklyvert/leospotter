name: Descobrir pista SBUR

on:
  workflow_dispatch:

jobs:
  descobrir:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar base de pistas
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = (
              "https://sistemas.anac.gov.br/"
              "dadosabertos/Aerodromos/"
              "Aer%C3%B3dromos%20P%C3%BAblicos/"
              "Pistas%20de%20Pouso%20e%20Decolagem/"
              "pda_aerodromos_publicos_pistas_pouso_decolagem.json"
          )

          print("Baixando base de pistas...")

          with urllib.request.urlopen(
              url,
              timeout=180
          ) as resposta:

              conteudo = resposta.read()

          print(
              "Tamanho:",
              len(conteudo),
              "bytes"
          )

          texto = conteudo.decode(
              "utf-8-sig"
          )

          dados = []

          for linha in texto.splitlines():

              linha = linha.strip()

              if not linha:
                  continue

              dados.append(
                  json.loads(linha)
              )

          print(
              "Registros:",
              len(dados)
          )

          # ========================================
          # MOSTRAR TIPOS DE CONJUNTO
          # ========================================

          print()
          print("========================================")
          print("CONJUNTOS DE DADOS")
          print("========================================")

          conjuntos = sorted(
              set(
                  str(
                      item.get(
                          "ConjuntoDado"
                      )
                  )
                  for item in dados
              )
          )

          for conjunto in conjuntos:

              quantidade = sum(
                  1
                  for item in dados
                  if str(
                      item.get(
                          "ConjuntoDado"
                      )
                  ) == conjunto
              )

              print(
                  quantidade,
                  "->",
                  conjunto
              )

          # ========================================
          # PROCURAR PÚBLICOS
          # ========================================

          print()
          print("========================================")
          print("PISTAS DE AERÓDROMOS PÚBLICOS")
          print("========================================")

          publicos = []

          for item in dados:

              conjunto = str(
                  item.get(
                      "ConjuntoDado"
                  )
              ).lower()

              if "públicos" in conjunto:

                  publicos.append(
                      item
                  )

          print(
              "Registros públicos:",
              len(publicos)
          )

          # ========================================
          # PROCURAR TERMOS RELACIONADOS AO SBUR
          # ========================================

          print()
          print("========================================")
          print("PROCURANDO SBUR / UBERABA / MARIO")
          print("========================================")

          encontrados = []

          termos = [
              "SBUR",
              "UBERABA",
              "MARIO DE ALMEIDA FRANCO",
              "MG0009"
          ]

          for item in publicos:

              texto_item = json.dumps(
                  item,
                  ensure_ascii=False
              ).upper()

              for termo in termos:

                  if termo in texto_item:

                      encontrados.append(
                          item
                      )

                      break

          print(
              "Registros encontrados:",
              len(encontrados)
          )

          for numero, item in enumerate(
              encontrados[:20],
              start=1
          ):

              print()
              print(
                  f"========== REGISTRO {numero} =========="
              )

              print(
                  json.dumps(
                      item,
                      ensure_ascii=False,
                      indent=2
                  )
              )

          # ========================================
          # MOSTRAR ALGUNS REGISTROS PÚBLICOS
          # ========================================

          if not encontrados:

              print()
              print("Nenhum termo encontrado.")
              print()
              print(
                  "Mostrando os primeiros "
                  "10 registros públicos:"
              )

              for numero, item in enumerate(
                  publicos[:10],
                  start=1
              ):

                  print()
                  print(
                      f"========== PÚBLICO {numero} =========="
                  )

                  print(
                      json.dumps(
                          item,
                          ensure_ascii=False,
                          indent=2
                      )
                  )

          print()
          print("========================================")
          print("TESTE FINALIZADO")
          print("========================================")

          PY
