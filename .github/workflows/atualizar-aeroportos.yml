name: Atualizar aeroportos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:

  atualizar:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # BAIXAR REPOSITÓRIO
      # ==========================================

      - name: Baixar repositório
        uses: actions/checkout@v4


      # ==========================================
      # RECONSTRUIR + ATUALIZAR BASE
      # ==========================================

      - name: Atualizar base de aeroportos
        run: |

          python - <<'PY'

          import csv
          import io
          import json
          import re
          import time
          import urllib.parse
          import urllib.request

          from html import unescape
          from pathlib import Path


          # ==========================================
          # CONFIGURAÇÃO
          # ==========================================

          ARQUIVO = Path(
              "data/aeroportos.json"
          )

          MINIMO_AERODROMOS = 7000

          INTERVALO_AISWEB = 0.3

          URL_ANAC_PUBLICOS = (
              "https://www.anac.gov.br/"
              "acesso-a-informacao/"
              "dados-abertos/"
              "areas-de-atuacao/"
              "aerodromos/"
              "lista-de-aerodromos-publicos-v2"
          )

          URL_ANAC_PRIVADOS = (
              "https://www.anac.gov.br/"
              "acesso-a-informacao/"
              "dados-abertos/"
              "areas-de-atuacao/"
              "aerodromos/"
              "lista-de-aerodromos-privados-v2"
          )


          print()
          print("========================================")
          print("LEOSPOTTER")
          print("ATUALIZAÇÃO DA BASE DE AEROPORTOS")
          print("========================================")
          print()


          # ==========================================
          # HTTP
          # ==========================================

          def baixar(url):

              print("Baixando:")
              print(url)

              requisicao = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/120 Safari/537.36"
                  }
              )

              with urllib.request.urlopen(
                  requisicao,
                  timeout=90
              ) as resposta:

                  dados = resposta.read()

                  status = resposta.status

                  final_url = resposta.geturl()


              print(
                  "HTTP:",
                  status
              )

              print(
                  "Bytes:",
                  len(dados)
              )

              return dados, final_url


          # ==========================================
          # LOCALIZAR RECURSO ANAC
          # ==========================================

          def localizar_recurso(url_pagina):

              dados, final_url = baixar(
                  url_pagina
              )

              html = dados.decode(
                  "utf-8",
                  errors="replace"
              )

              html = unescape(
                  html
              )

              # --------------------------------------
              # Procurar links CSV / JSON
              # --------------------------------------

              links = re.findall(
                  r'href\s*=\s*["\']([^"\']+)["\']',
                  html,
                  flags=re.I
              )

              candidatos = []

              for link in links:

                  link = link.strip()

                  if not link:
                      continue

                  absoluto = urllib.parse.urljoin(
                      final_url,
                      link
                  )

                  texto = absoluto.lower()

                  if (
                      ".csv" in texto
                      or
                      ".json" in texto
                      or
                      "download" in texto
                  ):

                      candidatos.append(
                          absoluto
                      )


              # --------------------------------------
              # Remover duplicados
              # --------------------------------------

              candidatos = list(
                  dict.fromkeys(
                      candidatos
                  )
              )


              print()
              print(
                  "Recursos encontrados:",
                  len(candidatos)
              )

              for candidato in candidatos:

                  print(
                      " -",
                      candidato
                  )


              if not candidatos:

                  raise Exception(
                      "Nenhum recurso CSV/JSON encontrado "
                      "na página da ANAC."
                  )


              # --------------------------------------
              # Tentar candidatos
              # --------------------------------------

              for candidato in candidatos:

                  try:

                      dados, _ = baixar(
                          candidato
                      )

                      if len(dados) < 1000:
                          continue

                      return dados

                  except Exception as erro:

                      print(
                          "Falha:",
                          erro
                      )


              raise Exception(
                  "Não foi possível baixar nenhum "
                  "recurso válido da ANAC."
              )


          # ==========================================
          # NORMALIZAR COLUNA
          # ==========================================

          def normalizar_coluna(valor):

              valor = str(
                  valor or ""
              )

              valor = (
                  valor
                  .strip()
                  .upper()
              )

              valor = re.sub(
                  r"[^A-Z0-9]+",
                  "_",
                  valor
              )

              return valor.strip("_")


          # ==========================================
          # LER CSV / JSON
          # ==========================================

          def interpretar_dados(dados):

              # --------------------------------------
              # JSON
              # --------------------------------------

              try:

                  texto_json = dados.decode(
                      "utf-8-sig"
                  )

                  obj = json.loads(
                      texto_json
                  )

                  if isinstance(
                      obj,
                      list
                  ):

                      return obj

                  if isinstance(
                      obj,
                      dict
                  ):

                      for chave in (
                          "data",
                          "dados",
                          "aerodromos",
                          "aeroportos",
                          "results",
                          "resultados"
                      ):

                          valor = obj.get(
                              chave
                          )

                          if isinstance(
                              valor,
                              list
                          ):

                              return valor

              except Exception:
                  pass


              # --------------------------------------
              # CSV
              # --------------------------------------

              texto = None

              for encoding in (
                  "utf-8-sig",
                  "cp1252",
                  "latin1"
              ):

                  try:

                      texto = dados.decode(
                          encoding
                      )

                      break

                  except UnicodeDecodeError:

                      pass


              if texto is None:

                  raise Exception(
                      "Não foi possível interpretar "
                      "o arquivo ANAC."
                  )


              linhas = texto.splitlines()

              if not linhas:

                  raise Exception(
                      "Arquivo ANAC vazio."
                  )


              primeira = linhas[0]

              if ";" in primeira:

                  delimitador = ";"

              elif "," in primeira:

                  delimitador = ","

              elif "\t" in primeira:

                  delimitador = "\t"

              else:

                  raise Exception(
                      "Delimitador do CSV não identificado."
                  )


              leitor = csv.DictReader(
                  io.StringIO(texto),
                  delimiter=delimitador
              )


              registros = []

              for linha in leitor:

                  registro = {}

                  for chave, valor in linha.items():

                      registro[
                          normalizar_coluna(chave)
                      ] = (
                          str(valor or "")
                          .strip()
                      )

                  registros.append(
                      registro
                  )


              return registros


          # ==========================================
          # LOCALIZAR VALOR
          # ==========================================

          def valor(registro, *nomes):

              for nome in nomes:

                  chave = normalizar_coluna(
                      nome
                  )

                  if chave in registro:

                      resultado = (
                          registro[chave]
                      )

                      if resultado:

                          return resultado


              return ""


          # ==========================================
          # NÚMERO
          # ==========================================

          def converter_numero(valor_original):

              if not valor_original:

                  return None

              texto = (
                  str(valor_original)
                  .strip()
                  .replace(",", ".")
              )

              try:

                  return float(
                      texto
                  )

              except ValueError:

                  return None


          # ==========================================
          # RECONSTRUIR BASE ANAC
          # ==========================================

          print()
          print("========================================")
          print("BAIXANDO BASE PÚBLICA ANAC")
          print("========================================")

          dados_publicos = localizar_recurso(
              URL_ANAC_PUBLICOS
          )

          registros_publicos = interpretar_dados(
              dados_publicos
          )


          print(
              "Registros públicos:",
              len(registros_publicos)
          )


          print()
          print("========================================")
          print("BAIXANDO BASE PRIVADA ANAC")
          print("========================================")

          dados_privados = localizar_recurso(
              URL_ANAC_PRIVADOS
          )

          registros_privados = interpretar_dados(
              dados_privados
          )


          print(
              "Registros privados:",
              len(registros_privados)
          )


          todos = []

          todos.extend(
              registros_publicos
          )

          todos.extend(
              registros_privados
          )


          # ==========================================
          # MONTAR NOVA BASE
          # ==========================================

          nova_base = []

          icaos = set()

          sem_icao = 0

          duplicados = 0


          for registro in todos:

              icao = valor(
                  registro,
                  "CÓDIGO OACI",
                  "CODIGO OACI",
                  "ICAO",
                  "OACI"
              )


              icao = (
                  str(icao)
                  .strip()
                  .upper()
              )


              if not re.fullmatch(
                  r"[A-Z]{4}",
                  icao
              ):

                  sem_icao += 1

                  continue


              if icao in icaos:

                  duplicados += 1

                  continue


              icaos.add(
                  icao
              )


              aeroporto = {

                  "icao":
                  icao,

                  "ciad":
                  valor(
                      registro,
                      "CIAD"
                  ),

                  "nome":
                  valor(
                      registro,
                      "NOME"
                  ),

                  "municipio":
                  valor(
                      registro,
                      "MUNICÍPIO",
                      "MUNICIPIO"
                  ),

                  "uf":
                  valor(
                      registro,
                      "UF"
                  ),

                  "municipio_servido":
                  valor(
                      registro,
                      "MUNICÍPIO SERVIDO",
                      "MUNICIPIO SERVIDO"
                  ),

                  "uf_servido":
                  valor(
                      registro,
                      "UF SERVIDO"
                  ),

                  "latitude":
                  valor(
                      registro,
                      "LATITUDE"
                  ),

                  "longitude":
                  valor(
                      registro,
                      "LONGITUDE"
                  ),

                  "elevacao":
                  converter_numero(
                      valor(
                          registro,
                          "ALTITUDE",
                          "ELEVAÇÃO",
                          "ELEVACAO"
                      )
                  ),

                  "operacao_diurna":
                  valor(
                      registro,
                      "OPERAÇÃO DIURNA",
                      "OPERACAO DIURNA"
                  ),

                  "operacao_noturna":
                  valor(
                      registro,
                      "OPERAÇÃO NOTURNA",
                      "OPERACAO NOTURNA"
                  ),

                  "pistas":
                  [],

                  "frequencias":
                  [],

                  "distancias_declaradas":
                  []

              }


              nova_base.append(
                  aeroporto
              )


          print()
          print("========================================")
          print("VALIDAÇÃO DA BASE ANAC")
          print("========================================")

          print(
              "Total bruto:",
              len(todos)
          )

          print(
              "ICAOs válidos:",
              len(nova_base)
          )

          print(
              "Sem ICAO:",
              sem_icao
          )

          print(
              "Duplicados:",
              duplicados
          )


          # ==========================================
          # PROTEÇÃO CONTRA BASE INCOMPLETA
          # ==========================================

          if len(nova_base) < MINIMO_AERODROMOS:

              raise Exception(
                  "ERRO CRÍTICO: ANAC retornou apenas "
                  + str(len(nova_base))
                  + " aeródromos. "
                  "Mínimo esperado: "
                  + str(MINIMO_AERODROMOS)
                  + ". "
                  "O arquivo existente NÃO será alterado."
              )


          # ==========================================
          # VALIDAR SBUR
          # ==========================================

          sbur = next(
              (
                  aeroporto
                  for aeroporto in nova_base
                  if aeroporto["icao"] == "SBUR"
              ),
              None
          )


          if not sbur:

              raise Exception(
                  "ERRO CRÍTICO: SBUR não encontrado."
              )


          print()
          print("SBUR encontrado:")
          print(
              json.dumps(
                  sbur,
                  ensure_ascii=False,
                  indent=2
              )
          )


          # ==========================================
          # PRESERVAR DADOS AISWEB EXISTENTES
          # ==========================================

          base_anterior = []

          if ARQUIVO.exists():

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      base_anterior = json.load(
                          arquivo
                      )

                  if not isinstance(
                      base_anterior,
                      list
                  ):

                      base_anterior = []

              except Exception:

                  base_anterior = []


          dados_anteriores = {
              str(
                  item.get(
                      "icao",
                      ""
                  )
              ).upper(): item
              for item in base_anterior
              if isinstance(
                  item,
                  dict
              )
          }


          # ==========================================
          # PRESERVAR AISWEB ANTERIOR
          # ==========================================

          for aeroporto in nova_base:

              anterior = dados_anteriores.get(
                  aeroporto["icao"]
              )

              if not anterior:

                  continue


              for campo in (
                  "pistas",
                  "frequencias",
                  "distancias_declaradas"
              ):

                  valor_anterior = anterior.get(
                      campo
                  )

                  if isinstance(
                      valor_anterior,
                      list
                  ):

                      aeroporto[campo] = (
                          valor_anterior
                      )


          # ==========================================
          # AISWEB
          # ==========================================

          def consultar_aisweb(icao):

              url = (
                  "https://aisweb.decea.mil.br/"
                  "?codigo="
                  + icao
                  + "&i=aerodromos"
              )


              requisicao = urllib.request.Request(

                  url,

                  headers={
                      "User-Agent":
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/120 Safari/537.36"
                  }

              )


              with urllib.request.urlopen(
                  requisicao,
                  timeout=60
              ) as resposta:

                  conteudo = resposta.read()


              texto = conteudo.decode(
                  "utf-8",
                  errors="replace"
              )


              texto = unescape(
                  texto
              )


              # --------------------------------------
              # LIMPAR HTML
              # --------------------------------------

              texto = re.sub(
                  r"<script.*?</script>",
                  " ",
                  texto,
                  flags=re.I | re.S
              )

              texto = re.sub(
                  r"<style.*?</style>",
                  " ",
                  texto,
                  flags=re.I | re.S
              )

              texto = re.sub(
                  r"<br\s*/?>",
                  "\n",
                  texto,
                  flags=re.I
              )

              texto = re.sub(
                  r"</p>|</div>|</tr>|</li>|</h[1-6]>",
                  "\n",
                  texto,
                  flags=re.I
              )

              texto = re.sub(
                  r"<[^>]+>",
                  " ",
                  texto
              )

              texto = re.sub(
                  r"[ \t]+",
                  " ",
                  texto
              )

              texto = re.sub(
                  r"\n\s*\n+",
                  "\n",
                  texto
              )

              texto = texto.strip()

              texto_upper = texto.upper()


              resultado = {

                  "pistas": [],

                  "frequencias": [],

                  "distancias_declaradas": []

              }


              # --------------------------------------
              # PISTA
              # --------------------------------------

              padrao_pista = re.search(

                  r"(\d{2})\s*-\s*.*?"
                  r"\(\s*"
                  r"(\d+)\s*[xX]\s*(\d+)"
                  r"\s+([A-Z0-9]+)"
                  r"\s+([0-9]+/[A-Z0-9/]+)"
                  r".*?"
                  r"\)\s*-\s*.*?"
                  r"-\s*(\d{2})",

                  texto_upper,

                  re.S

              )


              if padrao_pista:

                  resultado["pistas"].append({

                      "identificacao":
                      padrao_pista.group(1)
                      + "/"
                      + padrao_pista.group(6),

                      "piso":
                      padrao_pista.group(4),

                      "dimensoes":
                      padrao_pista.group(2)
                      + " x "
                      + padrao_pista.group(3)
                      + " m",

                      "resistencia":
                      padrao_pista.group(5)

                  })


              # --------------------------------------
              # FREQUÊNCIAS
              # --------------------------------------

              frequencias = re.findall(

                  r"(?:COM\s*-\s*)?"
                  r"([A-ZÀ-Ú0-9 /-]{2,40})"
                  r"\s+\[\d+\]"
                  r"(?:\s+\[\d+\])*"
                  r"\s+"
                  r"(\d{3}\.\d{3})",

                  texto_upper

              )


              for servico, frequencia in frequencias:

                  servico = servico.strip()


                  existe = any(

                      f["orgao"] == servico
                      and
                      f["valor"] == frequencia

                      for f in resultado[
                          "frequencias"
                      ]

                  )


                  if not existe:

                      resultado[
                          "frequencias"
                      ].append({

                          "orgao":
                          servico,

                          "valor":
                          frequencia,

                          "observacao":
                          ""

                      })


              # --------------------------------------
              # DISTÂNCIAS
              # --------------------------------------

              padrao_distancias = re.findall(

                  r"\n\s*(\d{2})\s+"
                  r"(\d+)\s+"
                  r"(\d+)\s+"
                  r"(\d+)\s+"
                  r"(\d+)",

                  texto

              )


              for (
                  cabeceira,
                  tora,
                  toda,
                  asda,
                  lda
              ) in padrao_distancias:

                  resultado[
                      "distancias_declaradas"
                  ].append({

                      "rwy":
                      cabeceira,

                      "tora":
                      int(tora),

                      "toda":
                      int(toda),

                      "asda":
                      int(asda),

                      "lda":
                      int(lda)

                  })


              return resultado


          # ==========================================
          # CONSULTAR AISWEB
          # ==========================================

          print()
          print("========================================")
          print("CONSULTANDO AISWEB")
          print("========================================")
          print()


          atualizados = 0

          falhas = 0

          total_pistas = 0

          total_frequencias = 0

          total_distancias = 0


          for numero, aeroporto in enumerate(
              nova_base,
              start=1
          ):

              icao = aeroporto["icao"]


              print(
                  f"[{numero}/{len(nova_base)}] "
                  f"{icao}"
              )


              try:

                  dados = consultar_aisweb(
                      icao
                  )


                  # --------------------------------
                  # Atualizar somente quando
                  # houver informação
                  # --------------------------------

                  if dados["pistas"]:

                      aeroporto["pistas"] = (
                          dados["pistas"]
                      )


                  if dados["frequencias"]:

                      aeroporto["frequencias"] = (
                          dados["frequencias"]
                      )


                  if dados[
                      "distancias_declaradas"
                  ]:

                      aeroporto[
                          "distancias_declaradas"
                      ] = (
                          dados[
                              "distancias_declaradas"
                          ]
                      )


                  atualizados += 1


                  total_pistas += len(
                      aeroporto["pistas"]
                  )

                  total_frequencias += len(
                      aeroporto["frequencias"]
                  )

                  total_distancias += len(
                      aeroporto[
                          "distancias_declaradas"
                      ]
                  )


                  print(
                      "  ✓ atualizado"
                  )


              except Exception as erro:

                  falhas += 1

                  print(
                      "  ! falha:",
                      erro
                  )

                  print(
                      "    Dados anteriores preservados."
                  )


              time.sleep(
                  INTERVALO_AISWEB
              )


          # ==========================================
          # VALIDAÇÃO FINAL
          # ==========================================

          print()
          print("========================================")
          print("VALIDAÇÃO FINAL")
          print("========================================")


          if len(nova_base) < MINIMO_AERODROMOS:

              raise Exception(
                  "ERRO CRÍTICO: base final "
                  "ficou abaixo do mínimo."
              )


          sbur_final = next(
              (
                  aeroporto
                  for aeroporto in nova_base
                  if aeroporto["icao"] == "SBUR"
              ),
              None
          )


          if not sbur_final:

              raise Exception(
                  "ERRO CRÍTICO: SBUR desapareceu."
              )


          print(
              "Aeródromos:",
              len(nova_base)
          )

          print(
              "SBUR: OK"
          )

          print(
              "AISWEB processados:",
              atualizados
          )

          print(
              "Falhas AISWEB:",
              falhas
          )

          print(
              "Pistas:",
              total_pistas
          )

          print(
              "Frequências:",
              total_frequencias
          )

          print(
              "Distâncias:",
              total_distancias
          )


          # ==========================================
          # SALVAR
          # ==========================================

          ARQUIVO.parent.mkdir(
              parents=True,
              exist_ok=True
          )


          arquivo_temporario = Path(
              "data/aeroportos.json.tmp"
          )


          with open(
              arquivo_temporario,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  nova_base,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )

              arquivo.write(
                  "\n"
              )


          # ------------------------------------------
          # Validar arquivo temporário
          # ------------------------------------------

          with open(
              arquivo_temporario,
              "r",
              encoding="utf-8"
          ) as arquivo:

              teste = json.load(
                  arquivo
              )


          if not isinstance(
              teste,
              list
          ):

              raise Exception(
                  "Arquivo final não é uma lista JSON."
              )


          if len(teste) < MINIMO_AERODROMOS:

              raise Exception(
                  "Arquivo final possui poucos registros."
              )


          # ------------------------------------------
          # Substituir somente agora
          # ------------------------------------------

          arquivo_temporario.replace(
              ARQUIVO
          )


          print()
          print("========================================")
          print("✓ BASE ATUALIZADA COM SUCESSO")
          print("========================================")

          print(
              "Registros:",
              len(nova_base)
          )

          print(
              "Arquivo:",
              ARQUIVO
          )

          PY


      # ==========================================
      # VERIFICAR ALTERAÇÕES
      # ==========================================

      - name: Verificar alterações
        id: verificar
        run: |

          if git diff --quiet -- data/aeroportos.json; then

            echo "alterado=false" >> "$GITHUB_OUTPUT"

            echo "Nenhuma alteração na base."

          else

            echo "alterado=true" >> "$GITHUB_OUTPUT"

            echo "A base foi alterada."

            git diff --stat -- data/aeroportos.json

          fi


      # ==========================================
      # COMMIT E PUSH
      # ==========================================

      - name: Commit e push
        if: steps.verificar.outputs.alterado == 'true'
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aeroportos.json

          git commit \
            -m "Atualizar base de aeroportos"

          git push


      # ==========================================
      # FINALIZAÇÃO
      # ==========================================

      - name: Finalização
        run: |

          echo ""
          echo "========================================"
          echo "ATUALIZAÇÃO CONCLUÍDA"
          echo "========================================"
