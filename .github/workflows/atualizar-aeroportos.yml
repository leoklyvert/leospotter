name: Atualizar aeroportos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:

  atualizar:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # BAIXAR REPOSITÓRIO
      # ==========================================

      - name: Baixar repositório
        uses: actions/checkout@v4


      # ==========================================
      # RECONSTRUIR BASE ANAC / SIROS
      # ==========================================

      - name: Reconstruir base de aeroportos
        run: |

          python - <<'PY'

          import csv
          import io
          import json
          import re
          import urllib.request

          from pathlib import Path


          # ==========================================
          # CONFIGURAÇÃO
          # ==========================================

          ARQUIVO = Path(
              "data/aeroportos.json"
          )

          TEMPORARIO = Path(
              "data/aeroportos.json.tmp"
          )

          URL = (
              "https://siros.anac.gov.br/"
              "siros/registros/aerodromo/"
              "aerodromos.csv"
          )

          # Proteção contra uma resposta
          # anormalmente pequena da ANAC.
          MINIMO_REGISTROS = 8000


          print()
          print("========================================")
          print("LEOSPOTTER")
          print("ATUALIZAÇÃO DA BASE DE AERÓDROMOS")
          print("========================================")
          print()


          # ==========================================
          # DOWNLOAD
          # ==========================================

          print("Baixando base ANAC/SIROS:")
          print(URL)
          print()


          requisicao = urllib.request.Request(

              URL,

              headers={
                  "User-Agent":
                  "Mozilla/5.0 "
                  "(Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/120 Safari/537.36"
              }

          )


          with urllib.request.urlopen(
              requisicao,
              timeout=120
          ) as resposta:

              dados = resposta.read()

              status = resposta.status


          print(
              "HTTP:",
              status
          )

          print(
              "Bytes:",
              len(dados)
          )

          print()


          if status != 200:

              raise Exception(
                  "ANAC retornou HTTP "
                  + str(status)
              )


          if len(dados) < 100000:

              raise Exception(
                  "Arquivo ANAC inesperadamente "
                  "pequeno. "
                  "Base atual preservada."
              )


          # ==========================================
          # DECODIFICAR
          # ==========================================

          texto = None

          for encoding in (
              "utf-8-sig",
              "utf-8",
              "cp1252",
              "latin1"
          ):

              try:

                  texto = dados.decode(
                      encoding
                  )

                  print(
                      "Codificação:",
                      encoding
                  )

                  break

              except UnicodeDecodeError:

                  continue


          if texto is None:

              raise Exception(
                  "Não foi possível decodificar "
                  "o CSV da ANAC."
              )


          # ==========================================
          # IDENTIFICAR SEPARADOR
          # ==========================================

          primeira_linha = (
              texto
              .splitlines()[0]
          )


          if ";" in primeira_linha:

              separador = ";"

          elif "," in primeira_linha:

              separador = ","

          else:

              raise Exception(
                  "Não foi possível identificar "
                  "o separador do CSV."
              )


          print(
              "Separador:",
              repr(separador)
          )

          print()


          # ==========================================
          # LER CSV
          # ==========================================

          leitor = csv.DictReader(

              io.StringIO(texto),

              delimiter=separador

          )


          colunas = (
              leitor.fieldnames
              or []
          )


          print("Colunas encontradas:")

          for coluna in colunas:

              print(
                  " -",
                  coluna
              )

          print()


          registros = list(
              leitor
          )


          print(
              "Registros brutos:",
              len(registros)
          )

          print()


          if len(registros) < MINIMO_REGISTROS:

              raise Exception(
                  "ERRO CRÍTICO: a ANAC retornou "
                  + str(len(registros))
                  + " registros. "
                  "Mínimo esperado: "
                  + str(MINIMO_REGISTROS)
                  + ". "
                  "Base atual preservada."
              )


          # ==========================================
          # FUNÇÕES DE NORMALIZAÇÃO
          # ==========================================

          def normalizar(
              valor
          ):

              if valor is None:

                  return ""

              return (
                  str(valor)
                  .replace(
                      "\ufeff",
                      ""
                  )
                  .strip()
              )


          def chave_campo(
              valor
          ):

              valor = normalizar(
                  valor
              ).upper()


              substituicoes = {

                  "Á": "A",
                  "À": "A",
                  "Ã": "A",
                  "Â": "A",

                  "É": "E",
                  "Ê": "E",

                  "Í": "I",

                  "Ó": "O",
                  "Ô": "O",
                  "Õ": "O",

                  "Ú": "U",

                  "Ç": "C"

              }


              for antigo, novo in (
                  substituicoes.items()
              ):

                  valor = valor.replace(
                      antigo,
                      novo
                  )


              valor = re.sub(
                  r"[^A-Z0-9]+",
                  "_",
                  valor
              )


              return valor.strip(
                  "_"
              )


          # ==========================================
          # MAPEAR COLUNAS
          # ==========================================

          mapa_colunas = {}


          for coluna in colunas:

              mapa_colunas[
                  chave_campo(
                      coluna
                  )
              ] = coluna


          def obter(
              registro,
              *nomes
          ):

              for nome in nomes:

                  chave = chave_campo(
                      nome
                  )


                  coluna = mapa_colunas.get(
                      chave
                  )


                  if coluna is not None:

                      valor = normalizar(
                          registro.get(
                              coluna,
                              ""
                          )
                      )


                      if valor:

                          return valor


              return ""


          # ==========================================
          # CONFIRMAR COLUNA ICAO
          # ==========================================

          coluna_icao = None


          for nome in (
              "SIGLA ICAO AERÓDROMO",
              "SIGLA ICAO",
              "ICAO",
              "OACI"
          ):

              chave = chave_campo(
                  nome
              )


              if chave in mapa_colunas:

                  coluna_icao = mapa_colunas[
                      chave
                  ]

                  break


          if coluna_icao is None:

              raise Exception(
                  "ERRO CRÍTICO: coluna ICAO "
                  "não encontrada na base ANAC."
              )


          print(
              "Coluna ICAO:",
              coluna_icao
          )

          print()


          # ==========================================
          # LER BASE ANTERIOR
          # ==========================================

          dados_antigos = {}


          if ARQUIVO.exists():

              print(
                  "Lendo base anterior:"
              )

              print(
                  ARQUIVO
              )

              print()


              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      antigo = json.load(
                          arquivo
                      )


                  if isinstance(
                      antigo,
                      list
                  ):

                      for item in antigo:

                          if not isinstance(
                              item,
                              dict
                          ):

                              continue


                          codigo = normalizar(
                              item.get(
                                  "icao",
                                  ""
                              )
                          ).upper()


                          if re.fullmatch(
                              r"[A-Z]{4}",
                              codigo
                          ):

                              dados_antigos[
                                  codigo
                              ] = item


                      print(
                          "Registros anteriores:",
                          len(dados_antigos)
                      )

                      print()


              except Exception as erro:

                  print(
                      "Aviso: não foi possível "
                      "ler a base anterior."
                  )

                  print(
                      erro
                  )

                  print()


          # ==========================================
          # CONSTRUIR NOVA BASE
          # ==========================================

          nova_base = []

          icaos = set()

          duplicados = 0

          sem_icao = 0

          preservados = 0


          for registro in registros:

              icao = obter(

                  registro,

                  "SIGLA ICAO AERÓDROMO",
                  "SIGLA ICAO",
                  "ICAO",
                  "OACI"

              )


              icao = (
                  icao
                  .upper()
                  .strip()
              )


              # ======================================
              # VALIDAR ICAO
              # ======================================

              if not re.fullmatch(
                  r"[A-Z]{4}",
                  icao
              ):

                  sem_icao += 1

                  continue


              # ======================================
              # REMOVER DUPLICADOS
              # ======================================

              if icao in icaos:

                  duplicados += 1

                  continue


              icaos.add(
                  icao
              )


              # ======================================
              # CAMPOS SIROS
              # ======================================

              iata = obter(

                  registro,

                  "SIGLA IATA AERÓDROMO",
                  "SIGLA IATA",
                  "IATA"

              )


              nome = obter(

                  registro,

                  "NOME AERÓDROMO",
                  "NOME",
                  "Nome Aeródromo"

              )


              municipio = obter(

                  registro,

                  "MUNICÍPIO AERÓDROMO",
                  "MUNICIPIO AERODROMO",
                  "MUNICÍPIO",
                  "MUNICIPIO"

              )


              uf = obter(

                  registro,

                  "ESTADO AERÓDROMO",
                  "ESTADO",
                  "UF"

              )


              pais = obter(

                  registro,

                  "PAÍS AERÓDROMO",
                  "PAIS AERODROMO",
                  "PAÍS",
                  "PAIS"

              )


              aeronave_critica = obter(

                  registro,

                  "AERONAVE CRÍTICA",
                  "AERONAVE CRITICA"

              )


              latitude = obter(

                  registro,

                  "LATITUDE"

              )


              longitude = obter(

                  registro,

                  "LONGITUDE"

              )


              # ======================================
              # DADOS ANTIGOS / AISWEB
              # ======================================

              anterior = dados_antigos.get(
                  icao
              )


              pistas = []

              frequencias = []

              distancias = []


              if anterior:

                  if isinstance(
                      anterior.get(
                          "pistas"
                      ),
                      list
                  ):

                      pistas = anterior[
                          "pistas"
                      ]


                  if isinstance(
                      anterior.get(
                          "frequencias"
                      ),
                      list
                  ):

                      frequencias = anterior[
                          "frequencias"
                      ]


                  if isinstance(
                      anterior.get(
                          "distancias_declaradas"
                      ),
                      list
                  ):

                      distancias = anterior[
                          "distancias_declaradas"
                      ]


                  if (
                      pistas
                      or frequencias
                      or distancias
                  ):

                      preservados += 1


              # ======================================
              # CRIAR REGISTRO
              # ======================================

              aeroporto = {

                  "icao":
                  icao,

                  "iata":
                  iata,

                  "nome":
                  nome,

                  "municipio":
                  municipio,

                  "uf":
                  uf,

                  "pais":
                  pais,

                  "aeronave_critica":
                  aeronave_critica,

                  "latitude":
                  latitude,

                  "longitude":
                  longitude,

                  "pistas":
                  pistas,

                  "frequencias":
                  frequencias,

                  "distancias_declaradas":
                  distancias

              }


              nova_base.append(
                  aeroporto
              )


          # ==========================================
          # RESULTADO
          # ==========================================

          print(
              "========================================"
          )

          print(
              "RESULTADO"
          )

          print(
              "========================================"
          )

          print()


          print(
              "Registros brutos:",
              len(registros)
          )


          print(
              "ICAOs válidos:",
              len(nova_base)
          )


          print(
              "Duplicados:",
              duplicados
          )


          print(
              "Sem ICAO:",
              sem_icao
          )


          print(
              "Registros com dados anteriores "
              "preservados:",
              preservados
          )


          print()


          # ==========================================
          # VALIDAÇÃO FINAL
          # ==========================================

          if len(nova_base) < MINIMO_REGISTROS:

              raise Exception(

                  "ERRO CRÍTICO: somente "
                  + str(len(nova_base))
                  + " aeródromos válidos. "
                  "Base atual preservada."

              )


          # ==========================================
          # PROCURAR SBUR
          # ==========================================

          sbur = None


          for aeroporto in nova_base:

              if aeroporto["icao"] == "SBUR":

                  sbur = aeroporto

                  break


          if sbur is None:

              raise Exception(
                  "ERRO CRÍTICO: SBUR "
                  "não foi encontrado."
              )


          print(
              "========================================"
          )

          print(
              "SBUR ENCONTRADO"
          )

          print(
              "========================================"
          )

          print()


          print(
              json.dumps(
                  sbur,
                  ensure_ascii=False,
                  indent=2
              )
          )


          print()


          # ==========================================
          # GRAVAR TEMPORÁRIO
          # ==========================================

          print(
              "Gravando arquivo temporário..."
          )


          with open(
              TEMPORARIO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(

                  nova_base,

                  arquivo,

                  ensure_ascii=False,

                  indent=2

              )

              arquivo.write(
                  "\n"
              )


          # ==========================================
          # VALIDAR JSON
          # ==========================================

          with open(
              TEMPORARIO,
              "r",
              encoding="utf-8"
          ) as arquivo:

              teste = json.load(
                  arquivo
              )


          if not isinstance(
              teste,
              list
          ):

              raise Exception(
                  "JSON final inválido."
              )


          if len(teste) < MINIMO_REGISTROS:

              raise Exception(
                  "JSON final possui somente "
                  + str(len(teste))
                  + " registros."
              )


          # ==========================================
          # SUBSTITUIR BASE
          # ==========================================

          TEMPORARIO.replace(
              ARQUIVO
          )


          # ==========================================
          # FINALIZAÇÃO PYTHON
          # ==========================================

          print()

          print(
              "========================================"
          )

          print(
              "✓ BASE RECONSTRUÍDA COM SUCESSO"
          )

          print(
              "========================================"
          )

          print()

          print(
              "Total de aeródromos:",
              len(nova_base)
          )

          print(
              "SBUR:",
              "OK"
          )

          print(
              "Arquivo:",
              ARQUIVO
          )

          print()


          PY


      # ==========================================
      # VERIFICAR ALTERAÇÕES
      # ==========================================

      - name: Verificar alterações
        id: verificar
        run: |

          if git diff --quiet -- data/aeroportos.json; then

            echo "alterado=false" >> "$GITHUB_OUTPUT"

            echo "Nenhuma alteração na base."

          else

            echo "alterado=true" >> "$GITHUB_OUTPUT"

            echo "A base foi alterada."

            git diff --stat -- data/aeroportos.json

          fi


      # ==========================================
      # COMMIT E PUSH
      # ==========================================

      - name: Commit e push
        if: steps.verificar.outputs.alterado == 'true'
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aeroportos.json

          git commit \
            -m "Atualizar base de aeroportos ANAC"

          git push


      # ==========================================
      # FINALIZAÇÃO
      # ==========================================

      - name: Finalização
        run: |

          echo ""
          echo "========================================"
          echo "LEOSPOTTER"
          echo "ATUALIZAÇÃO CONCLUÍDA"
          echo "========================================"
          echo ""
