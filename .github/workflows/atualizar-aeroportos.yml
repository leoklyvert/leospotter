name: Descobrir arquivos de pistas ANAC

on:
  workflow_dispatch:

jobs:
  descobrir:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar diretório de pistas
        run: |
          python - <<'PY'
          import urllib.request

          url = (
              "https://sistemas.anac.gov.br/"
              "dadosabertos/Aerodromos/"
              "Aer%C3%B3dromos%20P%C3%BAblicos/"
              "Pistas%20de%20Pouso%20e%20Decolagem/"
          )

          print("Consultando:")
          print(url)
          print()

          with urllib.request.urlopen(
              url,
              timeout=60
          ) as resposta:

              conteudo = resposta.read()

          print(
              conteudo.decode(
                  "utf-8-sig",
                  errors="replace"
              )
          )
          PY
