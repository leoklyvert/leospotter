name: Atualizar base de aeroportos

on:
  workflow_dispatch:

  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

jobs:
  atualizar-aeroportos:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Baixar e processar base ANAC
        run: |
          python - <<'PY'
          import requests
          import json
          import csv
          import io
          import os
          import re

          print("Iniciando atualização da base de aeroportos...")

          # ==================================================
          # URLs OFICIAIS ANAC
          # ==================================================

          url_aerodromos = "https://www.anac.gov.br/dadosabertos/areas-de-atuacao/aerodromos/aerodromos-publicos-caracteristicas-gerais/aerodromos-publicos-caracteristicas-gerais.csv"

          url_pistas = "https://www.anac.gov.br/dadosabertos/areas-de-atuacao/aerodromos/aerodromos-publicos-pistas-de-pouso-e-decolagem/aerodromos-publicos-pistas-de-pouso-e-decolagem.csv"


          def baixar(url):

              print(f"Baixando:")
              print(url)

              resposta = requests.get(
                  url,
                  timeout=120
              )

              resposta.raise_for_status()

              return resposta.content


          # ==================================================
          # DOWNLOAD
          # ==================================================

          dados_aerodromos = baixar(
              url_aerodromos
          )

          dados_pistas = baixar(
              url_pistas
          )


          # ==================================================
          # DETECTAR CSV
          # ==================================================

          def ler_csv(conteudo):

              texto = conteudo.decode(
                  "utf-8-sig",
                  errors="replace"
              )

              amostra = texto[:5000]

              try:
                  dialect = csv.Sniffer().sniff(
                      amostra,
                      delimiters=";,|\t"
                  )
                  delimitador = dialect.delimiter

              except Exception:
                  delimitador = ";"

              leitor = csv.DictReader(
                  io.StringIO(texto),
                  delimiter=delimitador
              )

              linhas = []

              for linha in leitor:

                  nova = {}

                  for chave, valor in linha.items():

                      if chave is None:
                          continue

                      chave = (
                          chave
                          .strip()
                          .upper()
                      )

                      valor = (
                          valor.strip()
                          if isinstance(valor, str)
                          else valor
                      )

                      nova[chave] = valor

                  linhas.append(nova)

              return linhas


          aerodromos = ler_csv(
              dados_aerodromos
          )

          pistas = ler_csv(
              dados_pistas
          )


          print(
              f"Aeródromos encontrados: {len(aerodromos)}"
          )

          print(
              f"Pistas encontradas: {len(pistas)}"
          )


          # ==================================================
          # FUNÇÕES AUXILIARES
          # ==================================================

          def primeiro(dados, *nomes):

              for nome in nomes:

                  valor = dados.get(
                      nome.upper()
                  )

                  if valor not in (
                      None,
                      ""
                  ):

                      return valor.strip()

              return ""


          def numero(valor):

              if not valor:
                  return None

              valor = (
                  str(valor)
                  .strip()
                  .replace(",", ".")
              )

              try:
                  numero = float(valor)

                  if numero.is_integer():
                      return int(numero)

                  return numero

              except Exception:
                  return None


          # ==================================================
          # MAPA DE PISTAS PELO CIAD
          # ==================================================

          pistas_por_ciad = {}


          for pista in pistas:

              ciad = primeiro(
                  pista,
                  "CIAD"
              )

              if not ciad:
                  continue


              menor = primeiro(
                  pista,
                  "CABECEIRA (MENOR)",
                  "CABECEIRA MENOR"
              )

              maior = primeiro(
                  pista,
                  "CABECEIRA (MAIOR)",
                  "CABECEIRA MAIOR"
              )

              designacao = ""

              if menor or maior:

                  designacao = (
                      f"{menor}/{maior}"
                      .strip("/")
                  )


              comprimento = numero(
                  primeiro(
                      pista,
                      "COMPRIMENTO"
                  )
              )


              largura = numero(
                  primeiro(
                      pista,
                      "LARGURA"
                  )
              )


              registro = {
                  "designacao": designacao,
                  "comprimento": comprimento,
                  "largura": largura,
                  "piso": None
              }


              pistas_por_ciad.setdefault(
                  ciad,
                  []
              ).append(
                  registro
              )


          # ==================================================
          # MONTAR BASE FINAL
          # ==================================================

          resultado = []


          for aeroporto in aerodromos:

              icao = primeiro(
                  aeroporto,
                  "CÓDIGO OACI",
                  "CODIGO OACI",
                  "OACI"
              ).upper()


              # Alguns registros podem não possuir ICAO.
              # Eles não são úteis para nossa pesquisa.
              if not icao:
                  continue


              ciad = primeiro(
                  aeroporto,
                  "CIAD"
              )


              registro = {

                  "icao": icao,

                  "nome": primeiro(
                      aeroporto,
                      "NOME"
                  ),

                  "municipio": primeiro(
                      aeroporto,
                      "MUNICÍPIO",
                      "MUNICIPIO"
                  ),

                  "uf": primeiro(
                      aeroporto,
                      "UF"
                  ),

                  "latitude": primeiro(
                      aeroporto,
                      "LATITUDE"
                  ),

                  "longitude": primeiro(
                      aeroporto,
                      "LONGITUDE"
                  ),

                  "elevacao": numero(
                      primeiro(
                          aeroporto,
                          "ELEVAÇÃO",
                          "ELEVACAO"
                      )
                  ),

                  "pistas":
                      pistas_por_ciad.get(
                          ciad,
                          []
                      ),

                  "frequencias": []
              }


              resultado.append(
                  registro
              )


          # ==================================================
          # ORDENAR POR ICAO
          # ==================================================

          resultado.sort(
              key=lambda x:
                  x["icao"]
          )


          # ==================================================
          # CRIAR DIRETÓRIO
          # ==================================================

          os.makedirs(
              "data",
              exist_ok=True
          )


          # ==================================================
          # SALVAR JSON
          # ==================================================

          caminho = (
              "data/aeroportos.json"
          )


          with open(
              caminho,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  resultado,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print(
              "======================================"
          )
          print(
              "BASE DE AEROPORTOS GERADA"
          )
          print(
              "======================================"
          )

          print(
              f"Registros: {len(resultado)}"
          )

          print(
              f"Arquivo: {caminho}"
          )


          # ==================================================
          # TESTE SBUR
          # ==================================================

          sbur = next(
              (
                  item
                  for item in resultado
                  if item["icao"] == "SBUR"
              ),
              None
          )


          if not sbur:

              raise Exception(
                  "SBUR não encontrada na base."
              )


          print()
          print(
              "✓ SBUR encontrada"
          )

          print(
              f"Nome: {sbur['nome']}"
          )

          print(
              f"Município: {sbur['municipio']}"
          )

          print(
              f"UF: {sbur['uf']}"
          )

          print(
              f"Pistas: {len(sbur['pistas'])}"
          )


          for pista in sbur["pistas"]:

              print(
                  f"  Pista {pista['designacao']}: "
                  f"{pista['comprimento']} x "
                  f"{pista['largura']} m"
              )


          print()
          print(
              "✓ Teste SBUR concluído"
          )

          PY

      - name: Verificar arquivo gerado
        run: |
          echo "Verificando aeroportos.json..."

          test -f data/aeroportos.json

          echo "Arquivo encontrado."

          echo "Primeiros registros:"
          head -40 data/aeroportos.json

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aeroportos.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração na base."
          else
            git commit -m "Atualiza base de aeroportos"
            git push
          fi
