name: Atualizar aeroportos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:

  atualizar:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # BAIXAR REPOSITÓRIO
      # ==========================================

      - name: Baixar repositório
        uses: actions/checkout@v4


      # ==========================================
      # RECONSTRUIR BASE ANAC
      # ==========================================

      - name: Reconstruir base de aeroportos
        run: |

          python - <<'PY'

          import csv
          import io
          import json
          import re
          import urllib.request

          from pathlib import Path


          # ==========================================
          # CONFIGURAÇÃO
          # ==========================================

          ARQUIVO = Path(
              "data/aeroportos.json"
          )

          ARQUIVO_TMP = Path(
              "data/aeroportos.json.tmp"
          )

          MINIMO = 7000


          URL_PUBLICOS = (
              "https://sistemas.anac.gov.br/"
              "dadosabertos/Aerodromos/"
              "Aer%C3%B3dromos%20P%C3%BAblicos/"
              "Lista%20de%20aer%C3%B3dromos%20p%C3%BAblicos/"
              "AerodromosPublicos.csv"
          )


          URL_PRIVADOS = (
              "https://sistemas.anac.gov.br/"
              "dadosabertos/Aerodromos/"
              "Aer%C3%B3dromos%20Privados/"
              "Lista%20de%20aerodromos%20privados/"
              "Aerodromos%20Privados/"
              "AerodromosPrivados.csv"
          )


          print()
          print("========================================")
          print("LEOSPOTTER")
          print("RECONSTRUÇÃO DA BASE DE AERÓDROMOS")
          print("========================================")
          print()


          # ==========================================
          # DOWNLOAD
          # ==========================================

          def baixar(url):

              print("Baixando:")
              print(url)
              print()

              requisicao = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/120 Safari/537.36"
                  }
              )

              with urllib.request.urlopen(
                  requisicao,
                  timeout=120
              ) as resposta:

                  dados = resposta.read()

                  print(
                      "HTTP:",
                      resposta.status
                  )

                  print(
                      "Tamanho:",
                      len(dados),
                      "bytes"
                  )

                  return dados


          # ==========================================
          # LER CSV ANAC
          # ==========================================

          def ler_csv(dados):

              texto = None

              for encoding in (
                  "latin1",
                  "cp1252",
                  "utf-8-sig",
                  "utf-8"
              ):

                  try:

                      texto = dados.decode(
                          encoding
                      )

                      break

                  except UnicodeDecodeError:

                      continue


              if texto is None:

                  raise Exception(
                      "Não foi possível decodificar "
                      "o CSV da ANAC."
                  )


              leitor = csv.reader(
                  io.StringIO(texto),
                  delimiter=";"
              )


              linhas = list(
                  leitor
              )


              if len(linhas) < 2:

                  raise Exception(
                      "CSV da ANAC vazio ou inválido."
                  )


              cabecalho = [
                  str(x).strip()
                  for x in linhas[0]
              ]


              registros = []


              for linha in linhas[1:]:

                  if not any(
                      str(x).strip()
                      for x in linha
                  ):

                      continue


                  registro = {}


                  for i, nome in enumerate(
                      cabecalho
                  ):

                      if i < len(linha):

                          registro[
                              nome
                          ] = str(
                              linha[i]
                          ).strip()

                      else:

                          registro[
                              nome
                          ] = ""


                  registros.append(
                      registro
                  )


              return registros


          # ==========================================
          # NORMALIZAR NOME DE COLUNA
          # ==========================================

          def normalizar_nome(nome):

              nome = str(
                  nome or ""
              ).strip().upper()


              nome = (
                  nome
                  .replace("Á", "A")
                  .replace("À", "A")
                  .replace("Ã", "A")
                  .replace("Â", "A")
                  .replace("É", "E")
                  .replace("Ê", "E")
                  .replace("Í", "I")
                  .replace("Ó", "O")
                  .replace("Ô", "O")
                  .replace("Õ", "O")
                  .replace("Ú", "U")
                  .replace("Ç", "C")
              )


              nome = re.sub(
                  r"[^A-Z0-9]+",
                  "_",
                  nome
              )


              return nome.strip("_")


          # ==========================================
          # TRANSFORMAR REGISTRO
          # ==========================================

          def transformar(registro):

              campos = {
                  normalizar_nome(
                      chave
                  ): valor
                  for chave, valor
                  in registro.items()
              }


              def pegar(*nomes):

                  for nome in nomes:

                      chave = normalizar_nome(
                          nome
                      )

                      if chave in campos:

                          valor = campos[
                              chave
                          ]

                          if valor:

                              return valor.strip()


                  return ""


              icao = pegar(
                  "CÓDIGO OACI",
                  "CODIGO OACI",
                  "ICAO",
                  "OACI"
              )


              icao = (
                  icao
                  .strip()
                  .upper()
              )


              if not re.fullmatch(
                  r"[A-Z]{4}",
                  icao
              ):

                  return None


              elevacao = pegar(
                  "ALTITUDE",
                  "ELEVAÇÃO",
                  "ELEVACAO"
              )


              try:

                  if elevacao:

                      elevacao = float(
                          elevacao.replace(
                              ",",
                              "."
                          )
                      )

              except Exception:

                  elevacao = None


              return {

                  "icao":
                  icao,

                  "ciad":
                  pegar(
                      "CIAD"
                  ),

                  "nome":
                  pegar(
                      "NOME"
                  ),

                  "municipio":
                  pegar(
                      "MUNICÍPIO",
                      "MUNICIPIO"
                  ),

                  "uf":
                  pegar(
                      "UF"
                  ),

                  "municipio_servido":
                  pegar(
                      "MUNICÍPIO SERVIDO",
                      "MUNICIPIO SERVIDO"
                  ),

                  "uf_servido":
                  pegar(
                      "UF SERVIDO"
                  ),

                  "latitude":
                  pegar(
                      "LATITUDE"
                  ),

                  "longitude":
                  pegar(
                      "LONGITUDE"
                  ),

                  "elevacao":
                  elevacao,

                  "operacao_diurna":
                  pegar(
                      "OPERAÇÃO DIURNA",
                      "OPERACAO DIURNA"
                  ),

                  "operacao_noturna":
                  pegar(
                      "OPERAÇÃO NOTURNA",
                      "OPERACAO NOTURNA"
                  ),

                  "pistas":
                  [],

                  "frequencias":
                  [],

                  "distancias_declaradas":
                  []

              }


          # ==========================================
          # PÚBLICOS
          # ==========================================

          print()
          print("========================================")
          print("AERÓDROMOS PÚBLICOS")
          print("========================================")


          dados_publicos = baixar(
              URL_PUBLICOS
          )


          publicos = ler_csv(
              dados_publicos
          )


          print(
              "Registros públicos:",
              len(publicos)
          )


          # ==========================================
          # PRIVADOS
          # ==========================================

          print()
          print("========================================")
          print("AERÓDROMOS PRIVADOS")
          print("========================================")


          dados_privados = baixar(
              URL_PRIVADOS
          )


          privados = ler_csv(
              dados_privados
          )


          print(
              "Registros privados:",
              len(privados)
          )


          # ==========================================
          # COMBINAR
          # ==========================================

          print()
          print("========================================")
          print("COMBINANDO BASES")
          print("========================================")


          todos = []

          todos.extend(
              publicos
          )

          todos.extend(
              privados
          )


          nova_base = []

          icaos = set()

          duplicados = 0

          invalidos = 0


          for registro in todos:

              aeroporto = transformar(
                  registro
              )


              if aeroporto is None:

                  invalidos += 1

                  continue


              icao = aeroporto[
                  "icao"
              ]


              if icao in icaos:

                  duplicados += 1

                  continue


              icaos.add(
                  icao
              )


              nova_base.append(
                  aeroporto
              )


          print(
              "Total bruto:",
              len(todos)
          )


          print(
              "ICAOs válidos:",
              len(nova_base)
          )


          print(
              "Duplicados:",
              duplicados
          )


          print(
              "Inválidos:",
              invalidos
          )


          # ==========================================
          # PROTEÇÃO
          # ==========================================

          if len(nova_base) < MINIMO:

              raise Exception(
                  "ERRO CRÍTICO: a ANAC retornou "
                  + str(len(nova_base))
                  + " registros. "
                  "Mínimo esperado: "
                  + str(MINIMO)
                  + ". "
                  "Arquivo atual preservado."
              )


          # ==========================================
          # SBUR
          # ==========================================

          sbur = next(
              (
                  x
                  for x in nova_base
                  if x["icao"] == "SBUR"
              ),
              None
          )


          if sbur is None:

              raise Exception(
                  "ERRO CRÍTICO: SBUR não encontrado."
              )


          print()
          print("SBUR encontrado:")
          print(
              json.dumps(
                  sbur,
                  ensure_ascii=False,
                  indent=2
              )
          )


          # ==========================================
          # PRESERVAR AISWEB
          # ==========================================

          anterior = {}


          if ARQUIVO.exists():

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados_anteriores = json.load(
                          arquivo
                      )


                  if isinstance(
                      dados_anteriores,
                      list
                  ):

                      for item in dados_anteriores:

                          if not isinstance(
                              item,
                              dict
                          ):

                              continue


                          codigo = str(
                              item.get(
                                  "icao",
                                  ""
                              )
                          ).strip().upper()


                          if codigo:

                              anterior[
                                  codigo
                              ] = item


              except Exception as erro:

                  print(
                      "Aviso:",
                      erro
                  )


          preservados = 0


          for aeroporto in nova_base:

              codigo = aeroporto[
                  "icao"
              ]


              antigo = anterior.get(
                  codigo
              )


              if antigo is None:

                  continue


              for campo in (
                  "pistas",
                  "frequencias",
                  "distancias_declaradas"
              ):

                  valor = antigo.get(
                      campo
                  )


                  if isinstance(
                      valor,
                      list
                  ):

                      aeroporto[
                          campo
                      ] = valor


              if (
                  aeroporto["pistas"]
                  or
                  aeroporto["frequencias"]
                  or
                  aeroporto[
                      "distancias_declaradas"
                  ]
              ):

                  preservados += 1


          print()
          print(
              "Registros com dados AISWEB "
              "preservados:",
              preservados
          )


          # ==========================================
          # VALIDAR NOVA BASE
          # ==========================================

          if len(nova_base) < MINIMO:

              raise Exception(
                  "A base final ficou abaixo "
                  "do mínimo permitido."
              )


          # ==========================================
          # SALVAR TEMPORÁRIO
          # ==========================================

          print()
          print(
              "Gerando arquivo temporário..."
          )


          with open(
              ARQUIVO_TMP,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  nova_base,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )

              arquivo.write(
                  "\n"
              )


          # ==========================================
          # TESTAR JSON
          # ==========================================

          with open(
              ARQUIVO_TMP,
              "r",
              encoding="utf-8"
          ) as arquivo:

              teste = json.load(
                  arquivo
              )


          if not isinstance(
              teste,
              list
          ):

              raise Exception(
                  "JSON final inválido."
              )


          if len(teste) < MINIMO:

              raise Exception(
                  "JSON final possui menos "
                  "de 7.000 registros."
              )


          # ==========================================
          # SUBSTITUIR
          # ==========================================

          ARQUIVO_TMP.replace(
              ARQUIVO
          )


          # ==========================================
          # RESULTADO
          # ==========================================

          print()
          print("========================================")
          print("✓ BASE RECONSTRUÍDA")
          print("========================================")
          print()

          print(
              "Total de aeródromos:",
              len(nova_base)
          )

          print(
              "SBUR:",
              "OK"
          )

          print(
              "Arquivo:",
              ARQUIVO
          )

          print()
          print(
              "A base está pronta para o LeoSpotter."
          )

          PY


      # ==========================================
      # VERIFICAR ALTERAÇÕES
      # ==========================================

      - name: Verificar alterações
        id: verificar
        run: |

          if git diff --quiet -- data/aeroportos.json; then

            echo "alterado=false" >> "$GITHUB_OUTPUT"

            echo "Nenhuma alteração."

          else

            echo "alterado=true" >> "$GITHUB_OUTPUT"

            echo "Base alterada."

            git diff --stat -- data/aeroportos.json

          fi


      # ==========================================
      # COMMIT
      # ==========================================

      - name: Commit e push
        if: steps.verificar.outputs.alterado == 'true'
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aeroportos.json

          git commit \
            -m "Reconstruir base de aeroportos"

          git push


      # ==========================================
      # FINALIZAÇÃO
      # ==========================================

      - name: Finalização
        run: |

          echo ""
          echo "========================================"
          echo "LEOSPOTTER"
          echo "ATUALIZAÇÃO CONCLUÍDA"
          echo "========================================"
