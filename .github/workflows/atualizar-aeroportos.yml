name: Atualizar aeroportos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

jobs:

  atualizar:

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # BAIXAR REPOSITÓRIO
      # ==========================================

      - name: Baixar repositório
        uses: actions/checkout@v4


      # ==========================================
      # ATUALIZAR BASE
      # ==========================================

      - name: Baixar e processar base ANAC
        run: |

          python - <<'PY'

          import csv
          import io
          import json
          import re
          import urllib.request

          from pathlib import Path


          # ==========================================
          # CONFIGURAÇÃO
          # ==========================================

          ARQUIVO = Path(
              "data/aeroportos.json"
          )

          TEMPORARIO = Path(
              "data/aeroportos.json.tmp"
          )

          URL = (
              "https://siros.anac.gov.br/"
              "siros/registros/aerodromo/"
              "aerodromos.csv"
          )

          # Proteção contra arquivo vazio/
          # resposta incorreta do servidor.
          MINIMO_REGISTROS = 700


          print()
          print("========================================")
          print("LEOSPOTTER")
          print("ATUALIZAÇÃO DA BASE DE AERÓDROMOS")
          print("========================================")
          print()


          # ==========================================
          # DOWNLOAD
          # ==========================================

          print("Baixando base ANAC/SIROS:")
          print(URL)
          print()


          requisicao = urllib.request.Request(
              URL,
              headers={
                  "User-Agent":
                  "Mozilla/5.0 "
                  "(Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/120 Safari/537.36"
              }
          )


          with urllib.request.urlopen(
              requisicao,
              timeout=120
          ) as resposta:

              dados = resposta.read()

              status = resposta.status


          print(
              "HTTP:",
              status
          )

          print(
              "Bytes:",
              len(dados)
          )

          print()


          if status != 200:

              raise Exception(
                  "ANAC retornou HTTP "
                  + str(status)
              )


          if len(dados) < 1000:

              raise Exception(
                  "Arquivo ANAC muito pequeno. "
                  "Base atual NÃO será alterada."
              )


          # ==========================================
          # DECODIFICAR
          # ==========================================

          texto = None

          for encoding in (
              "utf-8-sig",
              "latin1",
              "cp1252",
              "utf-8"
          ):

              try:

                  texto = dados.decode(
                      encoding
                  )

                  print(
                      "Codificação:",
                      encoding
                  )

                  break

              except UnicodeDecodeError:

                  pass


          if texto is None:

              raise Exception(
                  "Não foi possível decodificar "
                  "o arquivo da ANAC."
              )


          # ==========================================
          # IDENTIFICAR SEPARADOR
          # ==========================================

          primeira_linha = texto.splitlines()[0]


          if ";" in primeira_linha:

              separador = ";"

          elif "," in primeira_linha:

              separador = ","

          else:

              raise Exception(
                  "Não foi possível identificar "
                  "o separador do CSV."
              )


          print(
              "Separador identificado:",
              repr(separador)
          )

          print()


          # ==========================================
          # LER CSV
          # ==========================================

          leitor = csv.DictReader(
              io.StringIO(texto),
              delimiter=separador
          )


          colunas = [
              str(x)
              for x in (
                  leitor.fieldnames or []
              )
          ]


          print("Colunas encontradas:")

          for coluna in colunas:

              print(
                  " -",
                  coluna
              )

          print()


          registros = list(
              leitor
          )


          print(
              "Registros brutos:",
              len(registros)
          )

          print()


          if len(registros) < MINIMO_REGISTROS:

              raise Exception(
                  "ERRO CRÍTICO: a ANAC retornou "
                  + str(len(registros))
                  + " registros. "
                  "Mínimo esperado: "
                  + str(MINIMO_REGISTROS)
                  + ". "
                  "O arquivo atual será preservado."
              )


          # ==========================================
          # NORMALIZAR CAMPO
          # ==========================================

          def normalizar(
              valor
          ):

              if valor is None:

                  return ""

              valor = str(
                  valor
              ).strip()

              valor = (
                  valor
                  .replace(
                      "\ufeff",
                      ""
                  )
              )

              return valor


          def nome_campo(
              nome
          ):

              nome = normalizar(
                  nome
              ).upper()

              nome = (
                  nome
                  .replace(
                      "Á",
                      "A"
                  )
                  .replace(
                      "À",
                      "A"
                  )
                  .replace(
                      "Ã",
                      "A"
                  )
                  .replace(
                      "Â",
                      "A"
                  )
                  .replace(
                      "É",
                      "E"
                  )
                  .replace(
                      "Ê",
                      "E"
                  )
                  .replace(
                      "Í",
                      "I"
                  )
                  .replace(
                      "Ó",
                      "O"
                  )
                  .replace(
                      "Ô",
                      "O"
                  )
                  .replace(
                      "Õ",
                      "O"
                  )
                  .replace(
                      "Ú",
                      "U"
                  )
                  .replace(
                      "Ç",
                      "C"
                  )
              )

              nome = re.sub(
                  r"[^A-Z0-9]+",
                  "_",
                  nome
              )

              return nome.strip("_")


          # ==========================================
          # MAPEAR COLUNAS
          # ==========================================

          mapa = {}

          for coluna in colunas:

              mapa[
                  nome_campo(
                      coluna
                  )
              ] = coluna


          def obter(
              registro,
              *nomes
          ):

              for nome in nomes:

                  chave = nome_campo(
                      nome
                  )

                  coluna = mapa.get(
                      chave
                  )

                  if coluna is not None:

                      valor = normalizar(
                          registro.get(
                              coluna,
                              ""
                          )
                      )

                      if valor:

                          return valor

              return ""


          # ==========================================
          # CONVERTER REGISTROS
          # ==========================================

          nova_base = []

          icaos = set()

          duplicados = 0

          sem_icao = 0


          for registro in registros:

              icao = obter(
                  registro,
                  "ICAO",
                  "OACI",
                  "Código OACI",
                  "Codigo OACI",
                  "CÓDIGO OACI"
              )


              icao = (
                  icao
                  .upper()
                  .strip()
              )


              if not re.fullmatch(
                  r"[A-Z]{4}",
                  icao
              ):

                  sem_icao += 1

                  continue


              if icao in icaos:

                  duplicados += 1

                  continue


              icaos.add(
                  icao
              )


              nome = obter(
                  registro,
                  "Nome",
                  "Nome do Aeródromo",
                  "Nome Aeródromo"
              )


              municipio = obter(
                  registro,
                  "Município",
                  "Municipio"
              )


              uf = obter(
                  registro,
                  "UF"
              )


              ciad = obter(
                  registro,
                  "CIAD"
              )


              latitude = obter(
                  registro,
                  "Latitude",
                  "LATITUDE"
              )


              longitude = obter(
                  registro,
                  "Longitude",
                  "LONGITUDE"
              )


              altitude = obter(
                  registro,
                  "Altitude",
                  "Elevação",
                  "Elevacao"
              )


              # ======================================
              # CONVERTER ALTITUDE
              # ======================================

              altitude_valor = None

              if altitude:

                  try:

                      altitude_valor = float(
                          altitude
                          .replace(
                              ",",
                              "."
                          )
                          .replace(
                              "m",
                              ""
                          )
                          .strip()
                      )

                  except Exception:

                      altitude_valor = None


              aeroporto = {

                  "icao":
                  icao,

                  "ciad":
                  ciad,

                  "nome":
                  nome,

                  "municipio":
                  municipio,

                  "uf":
                  uf,

                  "latitude":
                  latitude,

                  "longitude":
                  longitude,

                  "elevacao":
                  altitude_valor,

                  "pistas":
                  [],

                  "frequencias":
                  [],

                  "distancias_declaradas":
                  []

              }


              nova_base.append(
                  aeroporto
              )


          # ==========================================
          # RESULTADO DA CONVERSÃO
          # ==========================================

          print("========================================")
          print("RESULTADO")
          print("========================================")
          print()

          print(
              "Registros brutos:",
              len(registros)
          )

          print(
              "ICAOs válidos:",
              len(nova_base)
          )

          print(
              "Duplicados:",
              duplicados
          )

          print(
              "Sem ICAO:",
              sem_icao
          )

          print()


          # ==========================================
          # PROTEÇÃO
          # ==========================================

          if len(nova_base) < MINIMO_REGISTROS:

              raise Exception(
                  "ERRO CRÍTICO: somente "
                  + str(len(nova_base))
                  + " aeródromos válidos. "
                  "Base atual preservada."
              )


          # ==========================================
          # PROCURAR SBUR
          # ==========================================

          sbur = None

          for aeroporto in nova_base:

              if aeroporto["icao"] == "SBUR":

                  sbur = aeroporto

                  break


          if sbur is None:

              raise Exception(
                  "ERRO CRÍTICO: SBUR não encontrado."
              )


          print(
              "SBUR encontrado:"
          )

          print(
              json.dumps(
                  sbur,
                  ensure_ascii=False,
                  indent=2
              )
          )

          print()


          # ==========================================
          # PRESERVAR DADOS AISWEB
          # ==========================================

          dados_antigos = {}


          if ARQUIVO.exists():

              try:

                  with open(
                      ARQUIVO,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      antigo = json.load(
                          arquivo
                      )


                  if isinstance(
                      antigo,
                      list
                  ):

                      for item in antigo:

                          if not isinstance(
                              item,
                              dict
                          ):

                              continue


                          codigo = normalizar(
                              item.get(
                                  "icao",
                                  ""
                              )
                          ).upper()


                          if codigo:

                              dados_antigos[
                                  codigo
                              ] = item


              except Exception as erro:

                  print(
                      "Aviso ao ler base anterior:",
                      erro
                  )


          preservados = 0


          for aeroporto in nova_base:

              codigo = aeroporto[
                  "icao"
              ]


              anterior = dados_antigos.get(
                  codigo
              )


              if anterior is None:

                  continue


              for campo in (
                  "pistas",
                  "frequencias",
                  "distancias_declaradas"
              ):

                  valor = anterior.get(
                      campo
                  )


                  if isinstance(
                      valor,
                      list
                  ):

                      aeroporto[
                          campo
                      ] = valor


              if (
                  aeroporto["pistas"]
                  or
                  aeroporto["frequencias"]
                  or
                  aeroporto[
                      "distancias_declaradas"
                  ]
              ):

                  preservados += 1


          print(
              "Dados AISWEB preservados:",
              preservados
          )

          print()


          # ==========================================
          # GRAVAR TEMPORÁRIO
          # ==========================================

          print(
              "Gravando arquivo temporário..."
          )


          with open(
              TEMPORARIO,
              "w",
              encoding="utf-8"
          ) as arquivo:

              json.dump(
                  nova_base,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )

              arquivo.write(
                  "\n"
              )


          # ==========================================
          # VALIDAR JSON
          # ==========================================

          with open(
              TEMPORARIO,
              "r",
              encoding="utf-8"
          ) as arquivo:

              teste = json.load(
                  arquivo
              )


          if not isinstance(
              teste,
              list
          ):

              raise Exception(
                  "JSON final inválido."
              )


          if len(teste) < MINIMO_REGISTROS:

              raise Exception(
                  "JSON final possui somente "
                  + str(len(teste))
                  + " registros."
              )


          # ==========================================
          # SUBSTITUIR BASE
          # ==========================================

          TEMPORARIO.replace(
              ARQUIVO
          )


          # ==========================================
          # FINAL
          # ==========================================

          print()
          print("========================================")
          print("✓ BASE ATUALIZADA")
          print("========================================")
          print()

          print(
              "Aeródromos:",
              len(nova_base)
          )

          print(
              "SBUR:",
              "OK"
          )

          print(
              "Arquivo:",
              ARQUIVO
          )

          print()


          PY


      # ==========================================
      # VERIFICAR ALTERAÇÕES
      # ==========================================

      - name: Verificar alterações
        id: verificar
        run: |

          if git diff --quiet -- data/aeroportos.json; then

            echo "alterado=false" >> "$GITHUB_OUTPUT"

            echo "Nenhuma alteração na base."

          else

            echo "alterado=true" >> "$GITHUB_OUTPUT"

            echo "A base foi alterada."

            git diff --stat -- data/aeroportos.json

          fi


      # ==========================================
      # COMMIT E PUSH
      # ==========================================

      - name: Commit e push
        if: steps.verificar.outputs.alterado == 'true'
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aeroportos.json

          git commit \
            -m "Atualizar base de aeroportos ANAC"

          git push


      # ==========================================
      # FINALIZAÇÃO
      # ==========================================

      - name: Finalização
        run: |

          echo ""
          echo "========================================"
          echo "LEOSPOTTER"
          echo "ATUALIZAÇÃO CONCLUÍDA"
          echo "========================================"
