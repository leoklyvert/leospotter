name: Atualizar base RAB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-rab:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Baixar RAB
        run: |
          curl -L "https://sistemas.anac.gov.br/dadosabertos/Aeronaves/RAB/dados_aeronaves.json" -o dados_aeronaves.json

      - name: Processar base RAB
        shell: python
        run: |
          import json
          import os

          print("Lendo base RAB...")

          with open(
              "dados_aeronaves.json",
              "r",
              encoding="utf-8-sig"
          ) as arquivo:
              dados = json.load(arquivo)

          print(f"Registros encontrados: {len(dados)}")

          resultado = []

          for aeronave in dados:

              matricula = (
                  aeronave.get("MARCA") or ""
              ).strip().upper()

              # Converte PSBZR para PS-BZR
              if len(matricula) == 5 and "-" not in matricula:
                  matricula = matricula[:2] + "-" + matricula[2:]

              if not matricula:
                  continue

              codigo_situacao = (
                  aeronave.get("CDINTERDICAO") or ""
              ).strip().upper()

              situacoes = {
                  "N": "NORMAL",
                  "S": "SUSPENSO",
                  "M": "CANCELADO"
              }

              situacao = situacoes.get(
                  codigo_situacao,
                  codigo_situacao or "NÃO INFORMADA"
              )

              registro = {
                  "matricula": matricula,
                  "fabricante": aeronave.get("NMFABRICANTE"),
                  "modelo": aeronave.get("DSMODELO"),
                  "numero_serie": aeronave.get("NRSERIE"),
                  "ano_fabricacao": aeronave.get("NRANOFABRICACAO"),
                  "tipo_icao": aeronave.get("CDTIPOICAO"),
                  "categoria": aeronave.get("DSCATEGORIAHOMOLOGACAO"),
                  "situacao": situacao
              }

              resultado.append(registro)

          os.makedirs("data", exist_ok=True)

          with open(
              "data/aeronaves.json",
              "w",
              encoding="utf-8"
          ) as arquivo:
              json.dump(
                  resultado,
                  arquivo,
                  ensure_ascii=False,
                  indent=2
              )

          print(f"Aeronaves processadas: {len(resultado)}")

      - name: Verificar PS-BZR
        shell: python
        run: |
          import json

          with open(
              "data/aeronaves.json",
              "r",
              encoding="utf-8"
          ) as arquivo:
              dados = json.load(arquivo)

          encontrada = next(
              (
                  aeronave
                  for aeronave in dados
                  if aeronave["matricula"] == "PS-BZR"
              ),
              None
          )

          if encontrada:
              print("PS-BZR encontrada!")
              print(
                  json.dumps(
                      encontrada,
                      indent=2,
                      ensure_ascii=False
                  )
              )
          else:
              raise Exception(
                  "PS-BZR não encontrada na base RAB."
              )

      - name: Salvar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/aeronaves.json

          git diff --cached --quiet || git commit -m "Atualizar base RAB"

          git push
